<title>Selavu</title>
<style>
/* Layout: phone-first app shell — sticky month header, scrolling cards, fixed bottom tab bar, bottom-sheet forms. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f7f8fa; --fg: #141b24; --muted: #66717f; --line: #e1e5eb;
  --accent: #1e6091; --accent-fg: #ffffff; --accent-soft: #e3eef7;
  --good: #23855a; --warn: #b26a00; --bad: #c2392f; --warn-soft: #fdf1dc; --bad-soft: #fbe5e3;
  --shadow: 0 1px 2px rgba(20,27,36,.06), 0 4px 16px rgba(20,27,36,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #161c24; --surface-2: #1c232d; --fg: #e6ebf1; --muted: #93a0ae; --line: #27303b;
  --accent: #5fa8dc; --accent-fg: #0d1117; --accent-soft: #19293a;
  --good: #5cc28f; --warn: #eaa846; --bad: #ef7d73; --warn-soft: #2c2415; --bad-soft: #321b1a;
  --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161c24; --surface-2: #1c232d; --fg: #e6ebf1; --muted: #93a0ae; --line: #27303b;
  --accent: #5fa8dc; --accent-fg: #0d1117; --accent-soft: #19293a;
  --good: #5cc28f; --warn: #eaa846; --bad: #ef7d73; --warn-soft: #2c2415; --bad-soft: #321b1a;
  --shadow: none; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); margin: 0; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 720px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.sync-dot.ok { background: var(--good); } .sync-dot.wait { background: var(--warn); } .sync-dot.bad { background: var(--bad); }
.sync-dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .sync-dot.busy { animation: none; } }
.sync-line { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.month button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.month span { min-width: 92px; text-align: center; font-weight: 600; font-size: 14px; }

main { max-width: 720px; margin: 0 auto; padding-block: 4px calc(var(--nav-h) + 88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font-size: 16px; }
.kpi span { font-size: 12px; color: var(--muted); }
.up { color: var(--bad); } .down { color: var(--good); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }

.cc { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.cc-head { display: flex; align-items: center; gap: 10px; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.cc-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.good { background: transparent; color: var(--good); border: 1px solid currentColor; }
.cc-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }

.donut-wrap { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }
.legend { display: grid; gap: 8px; min-width: 0; }
.leg { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.leg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leg .meter { grid-column: 2 / 4; height: 5px; }
svg text { fill: var(--muted); font: 11px var(--font); }
svg .lbl-strong { fill: var(--fg); font-weight: 700; font-size: 18px; }

.list { display: grid; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 4px 6px; }
.tx { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.tx:last-child { border-bottom: 0; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.tx .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { font-weight: 600; text-align: right; }
.tx .amt.other { color: var(--muted); font-style: italic; }
.tx > div { min-width: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 6px 0; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs .add { width: 56px; height: 56px; border-radius: 18px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 6px 18px rgba(30,96,145,.35); }
nav.tabs .add svg { width: 28px; height: 28px; stroke-width: 2.4; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

.sheet-back { position: fixed; inset: 0; background: rgba(8,12,18,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto;
  border-radius: 20px 20px 0 0; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto; }
.sheet h3 { margin: 0; font-size: 18px; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.in { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; color: var(--fg); }
.amount-in { font-size: 38px; font-weight: 700; text-align: center; border: 0; background: none; padding: 4px; width: 100%; color: var(--fg); }
.amount-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 38px; font-weight: 700; color: var(--muted); border-bottom: 2px solid var(--line); }
.amount-wrap:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.chip .swatch { width: 9px; height: 9px; border-radius: 50%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.daybtn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; cursor: pointer; }
.daybtn[aria-expanded="true"] { border-color: var(--accent); }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.daygrid button { aspect-ratio: 1; min-height: 36px; border: 0; border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 15px; color: var(--fg); padding: 0; }
.daygrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.banner { background: var(--warn-soft); color: var(--fg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 10px; justify-items: center; }
.empty p { margin: 0; max-width: 34ch; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row > div { min-width: 0; }
.budget-grid { display: grid; grid-template-columns: 1fr 120px; gap: 8px 12px; align-items: center; }
.budget-grid .in { padding: 8px 10px; font-size: 15px; }
.stmt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.stmt:last-child { border-bottom: 0; }
.toggle { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
</style>

<header class="top gutter">
  <div class="top-row">
    <div class="brand">Selavu <span id="syncDot" class="sync-dot" role="img" hidden></span></div>
    <div class="month" id="monthNav">
      <button type="button" id="prevM" aria-label="Previous month">‹</button>
      <span id="monthLbl"></span>
      <button type="button" id="nextM" aria-label="Next month">›</button>
    </div>
  </div>
</header>

<main class="gutter" id="view"></main>

<nav class="tabs" aria-label="Sections">
  <div class="inner">
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

  </div>
</nav>

<script>
(function () {
'use strict';

// ---------- Constants ----------
var STORE = 'selavu.v1';
var CATS = ['Food & Dining', 'Groceries', 'Fuel', 'Travel', 'Shopping', 'Bills & Utilities', 'Rent & Housing', 'Home & Repairs',
  'Health', 'Subscriptions', 'EMI & Loans', 'Entertainment', 'Gifts & Functions', 'Sports & Fitness', 'Personal', 'Savings & Investments', 'Other'];
var CAT_COLORS = ['#e07b39', '#3a9d6e', '#c9473d', '#2f8fc2', '#8a5cc2', '#d4a72c', '#5b6fd6', '#a07040', '#d0587e', '#3aa3a0',
  '#7d8a99', '#b85cb0', '#e09a2f', '#4d9b3a', '#c77d64', '#2f6fb3', '#9aa4b0'];
var KINDS = ['Expense', 'Transfer', 'Lent', 'Received'];
var CARD_TYPES = ['Credit', 'Debit', 'UPI', 'Cash'];
var CARD_COLORS = ['#2f6fb3', '#e07b39', '#3a9d6e', '#8a5cc2', '#c9473d', '#c99a1c', '#3b9fb5', '#7d8a99'];
// Free text (from imports or a Shortcut) → [kind, category]
var MAP = { 'outside food': ['Expense', 'Food & Dining'], 'zomato': ['Expense', 'Food & Dining'], 'swiggy': ['Expense', 'Food & Dining'],
  'snacks erode': ['Expense', 'Food & Dining'], 'zepto': ['Expense', 'Groceries'], 'blinkit': ['Expense', 'Groceries'],
  'vegetables': ['Expense', 'Groceries'], 'chicken': ['Expense', 'Groceries'], 'market purchase': ['Expense', 'Groceries'],
  'emi': ['Expense', 'EMI & Loans'], 'rent': ['Expense', 'Rent & Housing'], 'rental agreement': ['Expense', 'Rent & Housing'],
  'bathroom pipe': ['Expense', 'Home & Repairs'], 'tv installation': ['Expense', 'Home & Repairs'], 'mattress purchase': ['Expense', 'Shopping'],
  'dress purchase': ['Expense', 'Shopping'], 'phone temper': ['Expense', 'Shopping'], 'amazon': ['Expense', 'Shopping'], 'flipkart': ['Expense', 'Shopping'],
  'decathlon purchase': ['Expense', 'Sports & Fitness'], 'sports': ['Expense', 'Sports & Fitness'], 'pangu marriage': ['Expense', 'Gifts & Functions'],
  'malli poo': ['Expense', 'Personal'], 'chit amount': ['Transfer', 'Savings & Investments'], 'srikanth transfer': ['Transfer', 'Other'],
  'lent to friend': ['Lent', 'Other'], 'received amount': ['Received', 'Other'], 'reimbursement received': ['Received', 'Other'],
  'cash / atm': ['Transfer', 'Other'], 'cash': ['Transfer', 'Other'], 'atm': ['Transfer', 'Other'] };

var inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// ---------- State ----------
var S = load();
var ui = { tab: 'home', ym: ymOf(new Date()), q: '', cardFilter: '' };

function blank() {
  return { v: 1, cards: [], tx: [], budgets: {}, paid: {}, lastCard: null, sample: false,
           sync: { url: '', key: '', sheetUrl: '', ops: [], meta: false, full: false, last: '', error: '' } };
}
function load() {
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) return Object.assign(blank(), s); }
  } catch (e) { /* storage blocked: run in memory */ }
  return blank();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('Could not save on this device. Export a backup from Settings.'); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---------- Dates & cycles ----------
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function ymAdd(ym, n) { var p = ym.split('-'); return ymOf(new Date(+p[0], +p[1] - 1 + n, 1)); }
function ymLabel(ym) { var p = ym.split('-'); return MON[+p[1] - 1] + ' ' + p[0]; }
function ymShort(ym) { var p = ym.split('-'); return MON[+p[1] - 1] + ' ' + p[0].slice(2); }
function parseLocal(s) { var m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : new Date(NaN); }
function toLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayLabel(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function today0() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

function cardById(id) { for (var i = 0; i < S.cards.length; i++) if (S.cards[i].id === id) return S.cards[i]; return null; }
function stmtDay(card) { return card && card.type === 'Credit' ? (+card.stmtDay || 0) : 0; }

// Bill month = month the statement is made. Statement-day purchases go to the next cycle.
function billMonthFor(card, d) {
  var s = stmtDay(card);
  if (!s) return ymOf(d);
  return ymOf(new Date(d.getFullYear(), d.getMonth() + (d.getDate() >= s ? 1 : 0), 1));
}
function billMonth(t) { return t._bm || (t._bm = billMonthFor(cardById(t.card), parseLocal(t.date))); }
function clearBm() { S.tx.forEach(function (t) { delete t._bm; }); }
// Statement made in month `ym` for a credit card.
function statement(card, ym) {
  var p = ym.split('-'), y = +p[0], m = +p[1] - 1, s = stmtDay(card);
  var date = new Date(y, m, s);
  return { ym: ym, start: new Date(y, m - 1, s), end: new Date(y, m, s - 1), date: date, due: dueDate(card, date) };
}
// First occurrence of the due day after the statement date (clamped to short months).
// Older cards saved "days after statement" instead; keep honouring that.
function dueDate(card, date) {
  var d = +card.dueDay;
  if (d) {
    var y = date.getFullYear(), m = date.getMonth() + (d <= date.getDate() ? 1 : 0);
    return new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate()));
  }
  return card.dueDays ? addDays(date, +card.dueDays) : null;
}
var counts = function (t) { return t.kind !== 'Received'; };

// ---------- Queries ----------
function sum(list) { return list.reduce(function (a, t) { return a + (+t.amount || 0); }, 0); }
function inMonth(ym) { return S.tx.filter(function (t) { return billMonth(t) === ym; }); }
function expenses(list) { return list.filter(function (t) { return t.kind === 'Expense'; }); }
function chargedOn(cardId, ym) { return sum(S.tx.filter(function (t) { return t.card === cardId && billMonth(t) === ym && counts(t); })); }

// ---------- Rendering helpers ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function catColor(c) { var i = CATS.indexOf(c); return i < 0 ? '#9aa4b0' : CAT_COLORS[i]; }
function initials(s) { return esc(String(s || '?').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || '?'); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

var toastTimer;
function toast(msg) {
  var r = $('#toastRoot');
  r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { r.innerHTML = ''; }, 3200);
}

// ---------- Charts (SVG) ----------
function donut(parts, total) {
  var r = 56, c = 2 * Math.PI * r, off = 0;
  var segs = parts.map(function (p) {
    var len = total ? p.value / total * c : 0;
    var s = '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="20" stroke-dasharray="' +
      Math.max(len - 1.5, 0.01).toFixed(2) + ' ' + c.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 75 75)"/>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Spending by category">' +
    '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="20"/>' + segs +
    '<text x="75" y="72" text-anchor="middle" class="lbl-strong">' + esc(compact(total)) + '</text>' +
    '<text x="75" y="90" text-anchor="middle">spent</text></svg>';
}
function compact(n) {
  var t = function (x) { return String(+x.toFixed(1)); };
  return n >= 100000 ? '₹' + t(n / 100000) + 'L' : n >= 1000 ? '₹' + t(n / 1000) + 'k' : inr.format(n);
}
function niceMax(v) {
  if (v <= 0) return 1000;
  var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  var steps = [1, 1.5, 2, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) if (f <= steps[i]) return steps[i] * p;
  return 10 * p;
}

function stackedBars(cols, series, height) {
  // cols: [{label, values:[...per series]}], series: [{name,color}]
  var W = 640, H = height || 200, L = 44, B = 22, T = 8, R = 6;
  var max = niceMax(Math.max.apply(null, cols.map(function (c) { return c.values.reduce(function (a, b) { return a + b; }, 0); }).concat([0])));
  var bw = (W - L - R) / cols.length, inner = Math.min(bw * 0.62, 38);
  var y = function (v) { return T + (H - T - B) * (1 - v / max); };
  var out = '';
  [0, 0.5, 1].forEach(function (f) {
    var yy = y(max * f);
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(compact(max * f)) + '</text>';
  });
  cols.forEach(function (c, i) {
    var x = L + i * bw + (bw - inner) / 2, acc = 0;
    c.values.forEach(function (v, j) {
      if (!v) return;
      var y1 = y(acc + v), y0 = y(acc);
      out += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + inner.toFixed(1) + '" height="' + Math.max(y0 - y1, 0.5).toFixed(1) +
        '" fill="' + series[j].color + '"' + (c.dim ? ' opacity=".45"' : '') + '><title>' + esc(c.label + ' · ' + series[j].name + ': ' + inr.format(v)) + '</title></rect>';
      acc += v;
    });
    if (c.label) out += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (c.strong ? ' style="fill:var(--fg);font-weight:600"' : '') + '>' + esc(c.label) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Bar chart">' + out + '</svg>';
}

// ---------- Views ----------
function render() {
  $('#monthLbl').textContent = ymLabel(ui.ym);
  $('#monthNav').hidden = !(ui.tab === 'home' || ui.tab === 'history');
  $$('nav.tabs [data-tab]').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'); });
  var v = $('#view');
  v.innerHTML = ({ home: viewHome, history: viewHistory, bills: viewBills, settings: viewSettings })[ui.tab]();
  bindView(v);
}

function sampleBanner() {
  return S.sample ? '<div class="banner"><span>You are looking at <b>sample data</b>.</span><button type="button" class="linkish" data-act="clear-sample">Clear sample &amp; start fresh</button></div>' : '';
}

function viewHome() {
  if (!S.cards.length) {
    return '<section class="card empty"><div class="big" style="font-size:26px">Track every card, cycle by cycle</div>' +
      '<p class="muted">Add your cards once: credit cards with their statement day, plus debit, UPI or cash. Then log each payment in one tap.</p>' +
      '<div class="btns" style="width:100%"><button type="button" class="btn" data-act="new-card">Add my first card</button>' +
      '<button type="button" class="btn ghost" data-act="sample">Try with sample data</button></div></section>';
  }
  var ym = ui.ym, now = ymOf(new Date());
  var month = inMonth(ym), exp = expenses(month), spent = sum(exp);
  var last = sum(expenses(inMonth(ymAdd(ym, -1))));
  var change = last ? (spent / last - 1) : null;
  var p = ym.split('-'), dim = new Date(+p[0], +p[1], 0).getDate();
  var days = ym === now ? new Date().getDate() : dim;
  var budgetTotal = CATS.reduce(function (a, c) { return a + (+S.budgets[c] || 0); }, 0);

  var h = sampleBanner();
  h += '<section class="card"><div class="row"><h2>Spent in ' + esc(ymLabel(ym)) + ' bills</h2>' +
    (ym === now ? '<span class="pill">This month</span>' : ym > now ? '<span class="pill warn">Upcoming</span>' : '<span class="pill good">Closed</span>') + '</div>' +
    '<div class="big">' + inr.format(spent) + '</div>' +
    (budgetTotal ? meter(spent, budgetTotal) + '<div class="small muted">' + inr.format(Math.max(budgetTotal - spent, 0)) + ' left of ' + inr.format(budgetTotal) + ' budget</div>' : '') +
    '<div class="kpis"><div class="kpi"><b>' + inr.format(last) + '</b><span>Last month</span></div>' +
    '<div class="kpi"><b class="' + (change == null ? '' : change > 0 ? 'up' : 'down') + '">' + (change == null ? '–' : (change > 0 ? '+' : '') + Math.round(change * 100) + '%') + '</b><span>Change</span></div>' +
    '<div class="kpi"><b>' + inr.format(days ? spent / days : 0) + '</b><span>Per day</span></div></div></section>';

  // Cards for this bill month
  var cc = S.cards.filter(function (c) { return stmtDay(c); });
  var other = S.cards.filter(function (c) { return !stmtDay(c); });
  if (S.cards.length) {
    h += '<section class="card"><h2>Cards · ' + esc(ymLabel(ym)) + '</h2>';
    var t0 = today0();
    cc.forEach(function (c) {
      var st = statement(c, ym), amt = chargedOn(c.id, ym), open = st.date > t0, key = c.id + '|' + ym, paid = S.paid[key];
      var status;
      if (st.start > t0) status = '<span class="pill">Not started</span>';
      else if (open) status = '<span class="pill">' + Math.round((st.date - t0) / 864e5) + ' days to statement</span>';
      else if (paid) status = '<span class="pill good">Paid</span>';
      else if (st.due && (st.due - t0) / 864e5 <= 3) status = '<span class="pill bad">' + (st.due < t0 ? 'Overdue' : 'Due ' + dayLabel(st.due)) + '</span>';
      else status = '<span class="pill warn">' + (st.due ? 'Due ' + dayLabel(st.due) : 'Statement out') + '</span>';
      h += '<div class="cc"><div class="cc-head"><span class="swatch" style="background:' + c.color + '"></span><span class="cc-name">' + esc(c.name) + '</span>' + status + '</div>' +
        '<div class="row"><b style="font-size:20px">' + inr.format(amt) + '</b><span class="small muted">' + dayLabel(st.start) + ' – ' + dayLabel(st.end) + '</span></div>' +
        (c.limit ? meter(amt, +c.limit) + '<div class="cc-meta"><span>' + Math.round(amt / c.limit * 100) + '% of ' + inr.format(+c.limit) + ' limit</span></div>' : '') + '</div>';
    });
    other.forEach(function (c) {
      var amt = chargedOn(c.id, ym);
      h += '<div class="cc"><div class="cc-head"><span class="swatch" style="background:' + c.color + '"></span><span class="cc-name">' + esc(c.name) + '</span><span class="pill">' + esc(c.type) + '</span></div>' +
        '<div class="row"><b style="font-size:20px">' + inr.format(amt) + '</b><span class="small muted">Calendar month</span></div></div>';
    });
    h += '</section>';
  }

  // Categories
  var byCat = {};
  exp.forEach(function (t) { byCat[t.category || 'Other'] = (byCat[t.category || 'Other'] || 0) + (+t.amount || 0); });
  var cats = Object.keys(byCat).map(function (k) { return { name: k, value: byCat[k], color: catColor(k) }; }).sort(function (a, b) { return b.value - a.value; });
  h += '<section class="card"><h2>Where it went</h2>';
  if (!cats.length) h += '<p class="muted small" style="margin:0">No spending in this bill month yet. Tap + to log one.</p>';
  else {
    h += '<div class="donut-wrap">' + donut(cats, spent) + '<div class="legend">' + cats.map(function (c) {
      var b = +S.budgets[c.name] || 0;
      return '<div class="leg"><span class="swatch" style="background:' + c.color + '"></span><span class="nm">' + esc(c.name) + '</span><b>' + inr.format(c.value) + '</b>' +
        (b ? meter(c.value, b) : '') + '</div>';
    }).join('') + '</div></div>';
  }
  h += '</section>';

  // 6-month trend by card
  var series = S.cards.map(function (c) { return { name: c.name, color: c.color }; });
  var cols = [];
  for (var i = -5; i <= 0; i++) {
    var m = ymAdd(ym, i), list = expenses(inMonth(m));
    cols.push({ label: ymShort(m), strong: i === 0, values: S.cards.map(function (c) { return sum(list.filter(function (t) { return t.card === c.id; })); }) });
  }
  h += '<section class="card"><h2>Last 6 months by card</h2>' + stackedBars(cols, series) +
    '<div class="chips">' + series.map(function (s) { return '<span class="small muted" style="display:inline-flex;gap:6px;align-items:center"><span class="swatch" style="background:' + s.color + '"></span>' + esc(s.name) + '</span>'; }).join('') + '</div></section>';

  // Daily (calendar month)
  var daily = [];
  for (var d = 1; d <= dim; d++) {
    var dd = new Date(+p[0], +p[1] - 1, d);
    var v = sum(S.tx.filter(function (t) { if (t.kind !== 'Expense') return false; var x = parseLocal(t.date); return x.getFullYear() === dd.getFullYear() && x.getMonth() === dd.getMonth() && x.getDate() === d; }));
    daily.push({ label: (d === 1 || d % 5 === 0) ? String(d) : '', values: [v], dim: dd > new Date() });
  }
  h += '<section class="card"><h2>Daily spend in ' + MON[+p[1] - 1] + ' (by date)</h2>' + stackedBars(daily, [{ name: 'Spent', color: 'var(--accent)' }], 160) + '</section>';

  // Not spending
  var tr = sum(month.filter(function (t) { return t.kind === 'Transfer'; }));
  var lent = sum(S.tx.filter(function (t) { return t.kind === 'Lent'; })), back = sum(S.tx.filter(function (t) { return t.kind === 'Received'; }));
  if (tr || lent || back) {
    h += '<section class="card"><h2>Not counted as spending</h2>' +
      '<div class="kpis"><div class="kpi"><b>' + inr.format(tr) + '</b><span>Transfers this month</span></div>' +
      '<div class="kpi"><b>' + inr.format(lent) + '</b><span>Lent (all time)</span></div>' +
      '<div class="kpi"><b>' + inr.format(Math.max(lent - back, 0)) + '</b><span>Still to get back</span></div></div></section>';
  }
  return h;
}

function meter(v, max) {
  var f = max ? v / max : 0;
  return '<div class="meter' + (f >= 1 ? ' bad' : f >= 0.8 ? ' warn' : '') + '"><i style="width:' + Math.min(f * 100, 100).toFixed(1) + '%"></i></div>';
}

function viewHistory() {
  if (!S.cards.length) return viewHome();
  var list = inMonth(ui.ym).filter(function (t) {
    if (ui.cardFilter && t.card !== ui.cardFilter) return false;
    if (!ui.q) return true;
    var c = cardById(t.card);
    return (t.note + ' ' + t.category + ' ' + t.kind + ' ' + (c ? c.name : '') + ' ' + t.amount).toLowerCase().indexOf(ui.q.toLowerCase()) >= 0;
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var h = sampleBanner() + '<section class="card"><div class="two"><input class="in" id="q" type="search" placeholder="Search note, amount…" value="' + esc(ui.q) + '">' +
    '<select class="in" id="cardFilter"><option value="">All cards</option>' + S.cards.map(function (c) { return '<option value="' + c.id + '"' + (ui.cardFilter === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
    '<div class="row small muted"><span>' + list.length + ' entries in ' + esc(ymLabel(ui.ym)) + ' bills</span><b>' + inr.format(sum(expenses(list))) + ' spent</b></div>';
  if (!list.length) return h + '<p class="muted small" style="margin:0">Nothing here. Credit card purchases show under the month their statement is made.</p></section>';
  var lastDay = '', out = '<div class="list">';
  list.forEach(function (t) {
    var d = parseLocal(t.date), key = d.toDateString();
    if (key !== lastDay) { out += '<div class="day">' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() + '</div>'; lastDay = key; }
    var c = cardById(t.card), isExp = t.kind === 'Expense';
    out += '<button type="button" class="tx" data-edit="' + t.id + '"><span class="ico" style="background:' + (isExp ? catColor(t.category) : '#7d8a99') + '">' + initials(isExp ? t.category : t.kind) + '</span>' +
      '<div><div class="t1">' + esc(t.note || (isExp ? t.category : t.kind)) + '</div><div class="t2">' + esc((c ? c.name : 'Unknown card') + ' · ' + (isExp ? t.category : t.kind) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes())) + '</div></div>' +
      '<div class="amt' + (isExp ? '' : ' other') + '">' + (t.kind === 'Received' ? '+' : '') + inr.format(+t.amount) + '</div></button>';
  });
  return h + out + '</div></section>';
}

function viewBills() {
  var cc = S.cards.filter(function (c) { return stmtDay(c); });
  if (!cc.length) return '<section class="card empty"><p class="muted">Add a credit card with its statement day in Settings to see bills here.</p><button type="button" class="btn" data-act="new-card">Add a credit card</button></section>';
  var t0 = today0(), h = sampleBanner();
  cc.forEach(function (c) {
    var dates = S.tx.filter(function (t) { return t.card === c.id; }).map(function (t) { return billMonth(t); });
    var open = billMonthFor(c, new Date());
    var first = dates.length ? dates.reduce(function (a, b) { return a < b ? a : b; }) : open;
    h += '<section class="card"><div class="cc-head"><span class="swatch" style="background:' + c.color + '"></span><span class="cc-name">' + esc(c.name) + '</span><span class="small muted">Statement on ' + ordinal(c.stmtDay) + '</span></div>';
    for (var m = open; m >= first; m = ymAdd(m, -1)) {
      var st = statement(c, m), amt = chargedOn(c.id, m), key = c.id + '|' + m, paid = !!S.paid[key], isOpen = st.date > t0;
      var dueSoon = !paid && !isOpen && st.due && (st.due - t0) / 864e5 <= 3;
      h += '<div class="stmt"><div><b>' + esc(ymLabel(m)) + '</b> <span class="small muted">' + dayLabel(st.start) + ' – ' + dayLabel(st.end) + '</span>' +
        '<div class="small ' + (dueSoon ? 'up' : 'muted') + '">' + (isOpen ? 'Open cycle · statement ' + dayLabel(st.date) : st.due ? 'Due ' + dayLabel(st.due) + (dueSoon ? (st.due < t0 ? ' · overdue' : ' · due soon') : '') : 'Set the payment due day on the card (Settings) to see the due date') + '</div></div>' +
        '<div style="display:grid;gap:6px;justify-items:end"><b>' + inr.format(amt) + '</b>' +
        (isOpen ? '<span class="pill">Open</span>' : '<button type="button" class="toggle" data-paid="' + key + '" aria-pressed="' + paid + '">' + (paid ? 'Paid' : 'Mark paid') + '</button>') + '</div></div>';
    }
    h += '</section>';
  });
  return h;
}
function ordinal(n) { n = +n; var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function viewSettings() {
  var h = '<section class="card"><div class="row"><h2>Your cards</h2><button type="button" class="linkish" data-act="new-card">+ Add card</button></div>';
  if (!S.cards.length) h += '<p class="muted small" style="margin:0">No cards yet.</p>';
  S.cards.forEach(function (c) {
    h += '<div class="set-row"><div class="cc-head" style="min-width:0"><span class="swatch" style="background:' + c.color + '"></span><div style="min-width:0"><div class="cc-name">' + esc(c.name) + '</div>' +
      '<div class="small muted">' + esc(c.type) + (stmtDay(c) ? ' · statement ' + ordinal(c.stmtDay) + (c.dueDay ? ' · due ' + ordinal(c.dueDay) : c.dueDays ? ' · due +' + c.dueDays + ' days' : '') : '') + (c.limit ? ' · limit ' + inr.format(+c.limit) : '') + '</div></div></div>' +
      '<button type="button" class="linkish" data-card="' + c.id + '">Edit</button></div>';

  h += '<section class="card"><h2>Monthly budgets</h2><p class="small muted" style="margin:0">Optional. Leave blank for no budget. Bars turn amber at 80% and red at 100%.</p><div class="budget-grid">' +
    CATS.map(function (c, i) { return '<label for="b' + i + '" style="display:flex;gap:8px;align-items:center"><span class="swatch" style="background:' + CAT_COLORS[i] + '"></span>' + esc(c) + '</label>' +
      '<input class="in" id="b' + i + '" data-budget="' + esc(c) + '" inputmode="numeric" placeholder="₹" value="' + (S.budgets[c] || '') + '">'; }).join('') + '</div></section>';

  if (!syncOn()) {
    h += '<section class="card"><h2>Google Sheet</h2><p class="small muted" style="margin:0">Connect your own Google Sheet and every entry is copied there automatically. ' +
      'The sheet gets a tab for each bill month and charts, downloads as Excel, and doubles as your backup.</p>' +
      (S.sample ? '<p class="small" style="margin:0">Connecting clears the sample data first.</p>' : '') +
      '<button type="button" class="btn block" data-act="connect">Connect Google Sheet</button>' +
      '<a class="small" href="https://github.com/prasannarajangv/selavu-app#7-connect-your-google-sheet" target="_blank" rel="noopener">How to set up your sheet</a></section>';
  } else {

      (S.sync.sheetUrl ? '<a class="btn ghost" style="text-align:center;text-decoration:none" href="' + esc(S.sync.sheetUrl) + '" target="_blank" rel="noopener">Open sheet</a>' : '') + '</div>' +
      '<button type="button" class="btn ghost block" data-act="pull">Restore from Google Sheet</button>' +
      '<button type="button" class="linkish" style="justify-self:start" data-act="disconnect">Disconnect</button></section>';
  }

  h += '<section class="card"><h2>This phone</h2>' +
    '<button type="button" class="btn danger block" data-act="reset">Delete all data on this phone</button></section>' +
    '<p class="small muted" style="text-align:center;margin:4px 0">Selavu · works offline · ' + S.tx.length + ' entries · ' + S.cards.length + ' cards</p>';
  return h;

// ---------- Events ----------
function bindView(v) {
  $$('[data-act]', v).forEach(function (b) { b.addEventListener('click', function () { actions[b.dataset.act](); }); });
  $$('[data-edit]', v).forEach(function (b) { b.addEventListener('click', function () { openExpense(S.tx.filter(function (t) { return t.id === b.dataset.edit; })[0]); }); });
  $$('[data-card]', v).forEach(function (b) { b.addEventListener('click', function () { openCard(cardById(b.dataset.card)); }); });
  $$('[data-paid]', v).forEach(function (b) { b.addEventListener('click', function () {
    var k = b.dataset.paid; if (S.paid[k]) delete S.paid[k]; else S.paid[k] = toLocal(new Date()); queueMeta(); save(); render(); }); });
  $$('[data-budget]', v).forEach(function (i) { i.addEventListener('change', function () {
    var n = Math.round(+String(i.value).replace(/[^\d.]/g, '')); if (n > 0) S.budgets[i.dataset.budget] = n; else delete S.budgets[i.dataset.budget]; i.value = S.budgets[i.dataset.budget] || ''; queueMeta(); save(); toast('Budget saved'); }); });

// ---------- Google Sheet sync ----------
// The phone is the source of truth. Every change is queued (by entry id) and sent to the person's own
// Google Sheet (Apps Script web app). Queued changes survive restarts and go out when the phone is online.
function keepSync(fresh) { fresh.sync = Object.assign(blank().sync, S.sync, { ops: [], meta: true, full: false }); return fresh; }
function syncOn() { return !!(S.sync && S.sync.url && !S.sample); }
function pendingCount() { return syncOn() ? S.sync.ops.length + (S.sync.full ? S.tx.length : 0) + (S.sync.meta && !S.sync.ops.length && !S.sync.full ? 1 : 0) : 0; }
function txById(id) { for (var i = 0; i < S.tx.length; i++) if (S.tx[i].id === id) return S.tx[i]; return null; }

function queueTx(id) { queueOp({ op: 'upsert', id: id }); }
function queueDel(id) { queueOp({ op: 'delete', id: id }); }
function queueOp(o) {
  if (!syncOn()) return;
  S.sync.ops = S.sync.ops.filter(function (x) { return x.id !== o.id; });
  S.sync.ops.push(o);
  scheduleSync();
}
// Cards, budgets or paid bills changed. `full` = bill months may have moved (statement day, type or name changed).
function queueMeta(full) { if (!syncOn()) return; S.sync.meta = true; if (full) S.sync.full = true; scheduleSync(); }

function txPayload(t) {
  var c = cardById(t.card), bm = billMonth(t), st = c && stmtDay(c) ? statement(c, bm) : null;
  return { id: t.id, date: t.date, card: c ? c.name : '', cardId: t.card, amount: +t.amount, kind: t.kind, category: t.category || '',
           note: t.note || '', billMonth: bm, cycle: st ? dayLabel(st.start) + ' – ' + dayLabel(st.end) : 'Calendar month' };
}

function api(body, conn) {
  conn = conn || S.sync;
  return fetch(conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
                           body: JSON.stringify(Object.assign({ k: conn.key }, body)) })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var j;
      try { j = JSON.parse(text); } catch (e) { throw new Error('The sheet didn\'t answer. Check that the script is deployed as a Web app with access "Anyone".'); }
      if (!j.ok) throw new Error(j.error === 'bad-key' ? 'The connection link is not valid any more. Get a new one from the sheet.' : 'Sheet error: ' + j.error);
      return j;
    }, function () { throw new Error(navigator.onLine ? 'Could not reach Google. Check the connection link.' : 'You are offline.'); });
}

var syncing = false, syncTimer = null;
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(function () { syncNow(false); }, ms == null ? 800 : ms); }

function syncNow(manual) {
  if (!syncOn() || syncing) return Promise.resolve();
  var sy = S.sync;
  if (!sy.ops.length && !sy.meta && !sy.full) { if (manual) toast('Everything is already in your sheet'); return Promise.resolve(); }
  if (navigator.onLine === false) { syncStatusChanged(); return Promise.resolve(); }
  syncing = true; syncStatusChanged();
  var sent = sy.ops.slice(), wasFull = sy.full, wasMeta = sy.meta;
  var body = { action: 'push' };
  if (wasFull) { body.full = true; body.tx = S.tx.map(txPayload); }
  else body.ops = sent.map(function (o) {
    if (o.op === 'delete') return { op: 'delete', id: o.id };
    var t = txById(o.id); return t ? { op: 'upsert', tx: txPayload(t) } : { op: 'delete', id: o.id };
  });
  if (wasFull || wasMeta) { body.cards = S.cards; body.budgets = S.budgets; body.paid = S.paid; }
  sy.full = false; sy.meta = false;
  return api(body).then(function (j) {
    // Drop what was sent; anything queued while the request was in flight stays for the next round.
    sy.ops = sy.ops.filter(function (o) { return sent.indexOf(o) < 0; });
    sy.last = toLocal(new Date()); sy.error = ''; if (j.sheetUrl) sy.sheetUrl = j.sheetUrl;
    save();
    if (manual) toast('Synced to Google Sheet');
  }, function (e) {
    sy.full = sy.full || wasFull; sy.meta = sy.meta || wasMeta; sy.error = e.message; save();
    if (manual) toast(e.message);
  }).then(function () {
    syncing = false; syncStatusChanged();
    if (!sy.error && (sy.ops.length || sy.meta || sy.full)) scheduleSync(1500);
  });
}

function syncStatusChanged() {
  var dot = $('#syncDot');
  if (dot) {
    var st = syncState();
    dot.hidden = !syncOn();
    dot.className = 'sync-dot ' + st.tone;
    dot.title = st.text;
    dot.setAttribute('aria-label', st.text);
  }
  if (ui.tab === 'settings' && !$('#sheetRoot').innerHTML) render();
}
function syncState() {
  if (!syncOn()) return { tone: '', text: 'Not connected' };
  var n = pendingCount(), sy = S.sync;
  if (syncing) return { tone: 'busy', text: 'Sending to Google Sheet…' };
  if (sy.error && n) return { tone: 'bad', text: sy.error };
  if (n) return { tone: 'wait', text: n + (n === 1 ? ' change' : ' changes') + ' waiting' + (navigator.onLine === false ? ': will send when you are online' : '') };
  return { tone: 'ok', text: 'Everything synced' + (sy.last ? ' · last at ' + sy.last.slice(11) + ' on ' + dayLabel(parseLocal(sy.last)) : '') };
}

function parseConnLink(s) {
  var m = /^(https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec)\?k=([\w-]+)\s*$/.exec(String(s || '').trim());
  return m ? { url: m[1], key: m[2] } : null;
}

  var html = '<div class="row"><h3>Connect Google Sheet</h3><button type="button" class="linkish" id="xClose">Cancel</button></div>' +
    '<p class="small muted" style="margin:0">In your copy of the Selavu sheet choose <b>Selavu → Get connection link for the app</b>, copy the link, and paste it here.</p>' +
    '<label class="f" for="cLink">Connection link<textarea class="in" id="cLink" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" style="resize:none;font-size:14px"></textarea></label>' +
    '<p class="small" id="cMsg" style="margin:0" aria-live="polite"></p>' +
    '<button type="button" class="btn block" id="cGo">Connect</button>';
  openSheet(html, function (sh) {
    var msg = $('#cMsg', sh), go = $('#cGo', sh);
    $('#xClose', sh).addEventListener('click', closeSheet);
    go.addEventListener('click', function () {
      var raw = $('#cLink', sh).value.trim(), conn = parseConnLink(raw);

        msg.textContent = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/.test(raw)
          ? 'This is the Web app URL, not the connection link yet. In your Google Sheet choose Selavu → 2. Get connection link for the app, paste this URL there, then copy the link it shows (it ends with ?k=…).'
          : 'That isn\'t a connection link. Get it from your Google Sheet: Selavu → 2. Get connection link for the app. It starts with https://script.google.com/macros/s/ and ends with ?k=…';
        msg.className = 'small up'; return;
      }
      go.disabled = true; go.textContent = 'Checking…'; msg.textContent = ''; msg.className = 'small';
      api({ action: 'ping' }, conn).then(function (j) {
        closeSheet();
        afterConnect(conn, j);
      }, function (e) { go.disabled = false; go.textContent = 'Connect'; msg.textContent = e.message; msg.className = 'small up'; });
    });
  });
}

function afterConnect(conn, ping) {
  if (S.sample) S = blank();
  var here = S.tx.length, there = ping.count || 0;
  var setConn = function () { S.sync = Object.assign(blank().sync, { url: conn.url, key: conn.key, sheetUrl: ping.sheetUrl || '' }); };
  if (there && !here) {
    setConn(); save();
    openSheet('<h3>Connected to "' + esc(ping.name || 'your sheet') + '"</h3><p class="muted" style="margin:0">Your sheet already has <b>' + there + ' entries</b>. Bring them to this phone?</p>' +
      '<button type="button" class="btn block" id="aPull">Bring them here</button><button type="button" class="btn ghost block" id="aLater">Not now</button>', function (sh) {
      $('#aLater', sh).addEventListener('click', function () { closeSheet(); render(); });
      $('#aPull', sh).addEventListener('click', function () { closeSheet(); restoreFromSheet(); });
    });
    return;
  }
  if (there && here) {
    openSheet('<h3>Both have data</h3><p class="muted" style="margin:0">This phone has <b>' + here + ' entries</b> and the sheet has <b>' + there + '</b>. Which one should be kept?</p>' +
      '<button type="button" class="btn block" id="aPhone">Keep this phone\'s data (replaces the sheet)</button>' +
      '<button type="button" class="btn ghost block" id="aSheet">Use the sheet\'s data (replaces this phone)</button>' +
      '<button type="button" class="btn ghost block" id="aNo">Cancel</button>', function (sh) {
      $('#aNo', sh).addEventListener('click', closeSheet);
      $('#aPhone', sh).addEventListener('click', function () { setConn(); S.sync.full = true; S.sync.meta = true; save(); closeSheet(); render(); syncNow(true); });
      $('#aSheet', sh).addEventListener('click', function () { setConn(); save(); closeSheet(); restoreFromSheet(); });
    });
    return;
  }
  setConn(); S.sync.full = !!here; S.sync.meta = true; save(); render();
  toast('Connected to Google Sheet' + (here ? '. Sending ' + here + ' entries…' : ''));
  syncNow(false);
}

function confirmRestore() {
  openSheet('<h3>Restore from Google Sheet?</h3><p class="muted" style="margin:0">This replaces the ' + S.tx.length + ' entries and cards on this phone with what is in your sheet.' +
    (pendingCount() ? ' <b>' + pendingCount() + ' changes on this phone have not reached the sheet yet and will be lost.</b>' : '') + '</p>' +
    '<button type="button" class="btn block" id="pYes">Restore from sheet</button><button type="button" class="btn ghost block" id="pNo">Cancel</button>', function (sh) {
    $('#pNo', sh).addEventListener('click', closeSheet);
    $('#pYes', sh).addEventListener('click', function () { closeSheet(); restoreFromSheet(); });
  });
}

function restoreFromSheet() {
  toast('Reading your Google Sheet…');
  return api({ action: 'pull' }).then(function (j) {
    var sync = S.sync;
    S = blank();
    S.sync = Object.assign(sync, { ops: [], error: '' });
    S.cards = (j.cards || []).map(function (c, i) {
      return { id: c.id, name: c.name, type: CARD_TYPES.indexOf(c.type) >= 0 ? c.type : 'Debit', stmtDay: +c.stmtDay || '', dueDay: +c.dueDay || '',
               dueDays: '', limit: +c.limit || '', color: c.color || CARD_COLORS[i % CARD_COLORS.length] };
    });
    S.tx = (j.tx || []).map(function (t) {
      return { id: t.id, date: t.date, card: t.card, amount: +t.amount, kind: KINDS.indexOf(t.kind) >= 0 ? t.kind : 'Expense',
               category: t.category || '', note: t.note || '' };
    });
    S.budgets = j.budgets || {}; S.paid = j.paid || {};
    S.lastCard = S.cards[0] ? S.cards[0].id : null;
    // Write back once so every row carries this app's bill month and cycle.
    S.sync.full = true; S.sync.meta = true;
    save(); ui.tab = 'home'; render();
    var noDay = S.cards.filter(function (c) { return c.type === 'Credit' && !c.stmtDay; });
    toast(S.tx.length + ' entries restored' + (noDay.length ? '. Set the statement day for ' + noDay.map(function (c) { return c.name; }).join(', ') : ''));
    if (noDay.length) { ui.tab = 'settings'; render(); }
    scheduleSync(1500);
  }, function (e) { toast(e.message); });
}

window.addEventListener('online', function () { syncStatusChanged(); scheduleSync(300); });
window.addEventListener('offline', syncStatusChanged);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') scheduleSync(300); });

// ---------- Sample data ----------
function loadSample() {
  var cards = [
    { id: 'sbi', name: 'SBI Credit Card', type: 'Credit', stmtDay: 23, dueDay: 12, limit: 150000, color: CARD_COLORS[0] },
    { id: 'axis', name: 'Axis Credit Card', type: 'Credit', stmtDay: 18, dueDay: 5, limit: 100000, color: CARD_COLORS[1] },
    { id: 'upi', name: 'Bank UPI', type: 'UPI', stmtDay: '', dueDays: '', limit: '', color: CARD_COLORS[2] },
    { id: 'cash', name: 'Cash', type: 'Cash', stmtDay: '', dueDays: '', limit: '', color: CARD_COLORS[7] }
  ];
  var plan = [['Food & Dining', 'Swiggy', 450, 'sbi'], ['Groceries', 'Zepto', 820, 'upi'], ['Fuel', 'Petrol', 1500, 'axis'], ['Food & Dining', 'Lunch', 260, 'upi'],
    ['Shopping', 'Amazon', 2499, 'sbi'], ['Bills & Utilities', 'Electricity', 1800, 'upi'], ['Groceries', 'Vegetables', 340, 'cash'], ['Subscriptions', 'Netflix', 649, 'axis'],
    ['Travel', 'Train tickets', 1240, 'sbi'], ['Health', 'Pharmacy', 560, 'upi'], ['Entertainment', 'Movie', 700, 'axis'], ['Food & Dining', 'Dinner out', 1350, 'sbi']];
  var tx = [], now = new Date(), seed = 7;
  var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (var back = 85; back >= 0; back -= 2) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back, 9 + Math.floor(rnd() * 12), Math.floor(rnd() * 60));
    var p = plan[Math.floor(rnd() * plan.length)];
    tx.push({ id: uid(), date: toLocal(d), card: p[3], amount: Math.round(p[2] * (0.6 + rnd() * 0.8)), kind: 'Expense', category: p[0], note: p[1] });
  }
  tx.push({ id: uid(), date: toLocal(new Date(now.getFullYear(), now.getMonth(), Math.max(now.getDate() - 10, 1), 18, 0)), card: 'upi', amount: 10000, kind: 'Expense', category: 'Rent & Housing', note: 'House rent' });
  tx.push({ id: uid(), date: toLocal(new Date(now.getFullYear(), now.getMonth(), Math.max(now.getDate() - 6, 1), 20, 0)), card: 'upi', amount: 2000, kind: 'Lent', category: '', note: 'Friend' });
  // Sample data is never synced (syncOn() is false while sample is set), but keep any sheet connection.
  S = keepSync(Object.assign(blank(), { cards: cards, tx: tx, budgets: { 'Food & Dining': 6000, 'Groceries': 5000, 'Fuel': 4000 }, lastCard: 'sbi', sample: true }));
  save(); render(); toast('Sample data loaded. Clear it any time.');
}

// ---------- Deep links: #add or ?amount=…&card=…&category=…&note=…&kind=… ----------
function handleLink() {
  var params = new URLSearchParams(location.search), hash = location.hash.replace('#', '');
  if (hash !== 'add' && !params.has('amount') && !params.has('add')) return;
  var pre = {};
  var amt = +String(params.get('amount') || '').replace(/[₹,\s]/g, ''); if (amt > 0) pre.amount = amt;
  var cn = (params.get('card') || '').toLowerCase();
  if (cn) S.cards.forEach(function (c) { if (c.name.toLowerCase() === cn) pre.card = c.id; });
  var cat = params.get('category') || ''; if (CATS.indexOf(cat) >= 0) pre.category = cat;
  var k = params.get('kind') || ''; if (KINDS.indexOf(k) >= 0) pre.kind = k;
  if (params.get('note')) pre.note = params.get('note');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  openExpense(null, pre);
}
window.addEventListener('hashchange', handleLink);

// ---------- Boot ----------
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
window.__selavu = { billMonthFor: billMonthFor, statement: statement, parseConnLink: parseConnLink, syncNow: syncNow, state: function () { return S; } };
render();
syncStatusChanged();
handleLink();
scheduleSync(1000);
})();
