// ---------- People forms ----------
function openPerson(p) {
  var edit = !!p, first = !S.people.length;
  p = p ? Object.assign({}, p) : { id: uid(), name: '' };
  var used = S.tx.filter(function (t) { return t.for === p.id || t.by === p.id; }).length + S.cards.filter(function (c) { return c.owner === p.id; }).length;
  var html = '<div class="row"><h3>' + (edit ? 'Edit person' : first ? 'Your name' : 'Add a person') + '</h3><button type="button" class="linkish" id="xClose">Cancel</button></div>' +
    (first ? '<p class="small muted" style="margin:0">Your existing cards and entries will be tagged as yours.</p>' : '') +
    '<label class="f" for="pName">Name<input class="in" id="pName" value="' + esc(p.name) + '" autocomplete="off" maxlength="20"></label>' +
    '<button type="button" class="btn block" id="pSave">Save</button>' +
    (edit ? '<button type="button" class="btn danger block" id="pDel">Remove ' + esc(p.name) + '</button>' : '');
  openSheet(html, function (sh) {
    $('#xClose', sh).addEventListener('click', closeSheet);
    setTimeout(function () { $('#pName', sh).focus(); }, 60);
    $('#pSave', sh).addEventListener('click', function () {
      var name = $('#pName', sh).value.trim(), old = p.name;
      if (!name) { toast('Type a name'); return; }
      if (/^(family|joint)$/i.test(name) || S.people.some(function (x) { return x.id !== p.id && x.name.toLowerCase() === name.toLowerCase(); })) { toast('Pick a different name'); return; }
      p.name = name;
      var i = S.people.map(function (x) { return x.id; }).indexOf(p.id);
      if (i >= 0) S.people[i] = p; else S.people.push(p);
      queue('person', p.id);
      if (first) {
        // First person = this phone's user; everything logged so far is theirs.
        S.me = p.id;
        S.cards.forEach(function (c) { if (!c.owner) { c.owner = p.id; queue('card', c.id); } });
        S.tx.forEach(function (t) { if (!t.for) { t.for = p.id; t.by = t.by || p.id; queue('tx', t.id); } });
      } else if (edit && old !== name) {
        // The sheet stores names, so rewrite rows that mention this person.
        S.cards.forEach(function (c) { if (c.owner === p.id) queue('card', c.id); });
        S.tx.forEach(function (t) { if (t.for === p.id || t.by === p.id) queue('tx', t.id); });
      }
      save(); closeSheet(); render();
      toast(edit ? 'Saved' : first ? 'Hi ' + name + '!' : name + ' added. Entries can now be tagged per person.');
    });
    if (edit) $('#pDel', sh).addEventListener('click', function () {
      if (used) { toast(p.name + ' has ' + used + ' entries or cards. Rename instead, or change those first.'); return; }
      S.people = S.people.filter(function (x) { return x.id !== p.id; });
      if (S.me === p.id) S.me = '';
      if (ui.who === p.id) ui.who = '';
      queue('person', p.id); save(); closeSheet(); render(); toast('Removed');
    });
  });
}

// "Who uses this phone?" Pick a person from the household, or add yourself.
// mine: { tx: [ids], cards: [ids] } logged on this phone before it joined the sheet; untagged ones become this person's.
function openWho(after, mine) {
  var cur = personById(S.me);
  var html = '<h3>Your name</h3><p class="small muted" style="margin:0">This phone will show only your cards and spending. Your entries appear under this name in the shared Google Sheet.</p>' +
    '<label class="f" for="wNew">Name<input class="in" id="wNew" autocomplete="off" maxlength="20" value="' + esc(cur ? cur.name : '') + '"></label>' +
    '<p class="hint" style="margin:0">Used this sheet on another phone before? Type the same name to get your entries back.</p>' +
    '<button type="button" class="btn block" id="wSave">Done</button>';
  openSheet(html, function (sh) {
    setTimeout(function () { $('#wNew', sh).focus(); }, 60);
    $('#wSave', sh).addEventListener('click', function () {
      var name = $('#wNew', sh).value.trim(), pickId;
      if (!name) { toast('Type your name'); return; }
      if (/^(family|joint)$/i.test(name)) { toast('Pick a different name'); return; }
      var same = S.people.filter(function (x) { return x.name.toLowerCase() === name.toLowerCase(); })[0];
      if (same) pickId = same.id;
      else { var np = { id: uid(), name: name }; S.people.push(np); queue('person', np.id); pickId = np.id; }
      S.me = pickId;
      if (mine) {
        S.cards.forEach(function (c) { if (!c.owner && mine.cards.indexOf(c.id) >= 0) { c.owner = pickId; queue('card', c.id); } });
        S.tx.forEach(function (t) { if (!t.for && mine.tx.indexOf(t.id) >= 0) { t.for = pickId; t.by = t.by || pickId; queue('tx', t.id); } });
      }
      var first = cardsSorted()[0];
      if (first && (!cardById(S.lastCard) || !myCard(cardById(S.lastCard)))) S.lastCard = first.id;
      ui.who = '';
      save(); closeSheet(); render(); toast('This phone is ' + personName(S.me) + '\'s');
      if (after) after();
    });
  });
}

// ---------- Actions ----------
var actions = {
  'new-card': function () { openCard(); },
  'new-person': function () { openPerson(); },
  who: function () { openWho(); },
  sample: function () { loadSample(); },
  'clear-sample': function () { S = keepSync(blank()); save(); render(); toast(syncOn() ? 'Sample cleared. Loading your sheet…' : 'Sample cleared. Add your first card.'); scheduleSync(200); },
  reset: function () {
    openSheet('<h3>Delete everything on this phone?</h3><p class="muted" style="margin:0">This removes all ' + S.tx.length + ' entries and ' + S.cards.length + ' cards from this phone. ' +
      (syncOn() ? 'It also disconnects the Google Sheet. The sheet is not changed: connect again to bring everything back.' : 'It cannot be undone.') + '</p>' +
      '<button type="button" class="btn danger block" id="rYes">Delete from this phone</button><button type="button" class="btn ghost block" id="rNo">Keep my data</button>', function (sh) {
      $('#rNo', sh).addEventListener('click', closeSheet);
      $('#rYes', sh).addEventListener('click', function () { S = blank(); save(); closeSheet(); ui.tab = 'home'; ui.who = ''; render(); syncStatusChanged(); toast('Deleted from this phone'); });
    });
  },
  connect: function () { openConnect(); },
  'sync-now': function () { if (!navigator.onLine) { toast('You are offline. Changes will be sent when you are back online.'); return; } syncNow(true); },
  pull: function () { confirmRestore(); },
  disconnect: function () {
    openSheet('<h3>Disconnect the Google Sheet?</h3><p class="muted" style="margin:0">New entries will stay only on this phone. The sheet keeps everything already sent.' +
      (pendingCount() ? ' <b>' + pendingCount() + ' changes have not been sent yet</b> and will not reach the sheet.' : '') + '</p>' +
      '<button type="button" class="btn danger block" id="dYes">Disconnect</button><button type="button" class="btn ghost block" id="dNo">Stay connected</button>', function (sh) {
      $('#dNo', sh).addEventListener('click', closeSheet);
      $('#dYes', sh).addEventListener('click', function () { S.sync = blank().sync; save(); closeSheet(); render(); toast('Google Sheet disconnected'); });
    });
  }
};

// ---------- Google Sheet sync ----------
// The Google Sheet is the household's shared book; each phone keeps a full copy and works offline.
// Every change is queued as {k, id} (k = tx | card | person | budget | paid) and sent with its current value
// (null = deleted). Each sync sends the queue, then takes the sheet's copy back, so entries logged on the other
// phone show up here. Changes still waiting on this phone win over the sheet's copy.
function keepSync(fresh) {
  fresh.me = S.me;
  fresh.sync = Object.assign(blank().sync, { url: S.sync.url, key: S.sync.key, sheetUrl: S.sync.sheetUrl });
  return fresh;
}
function syncOn() { return !!(S.sync && S.sync.url && !S.sample); }
function pendingCount() { return syncOn() ? S.sync.ops.length : 0; }
function txById(id) { for (var i = 0; i < S.tx.length; i++) if (S.tx[i].id === id) return S.tx[i]; return null; }

function queue(k, id) {
  if (!syncOn()) return;
  S.sync.ops = S.sync.ops.filter(function (o) { return !(o.k === k && o.id === id); });
  S.sync.ops.push({ k: k, id: id });
  scheduleSync();
}
function queueTx(id) { queue('tx', id); }
function queueDel(id) { queue('tx', id); }
function queueAll() {
  S.people.forEach(function (p) { queue('person', p.id); });
  S.cards.forEach(function (c) { queue('card', c.id); });
  Object.keys(S.budgets).forEach(function (k) { queue('budget', k); });
  Object.keys(S.paid).forEach(function (k) { queue('paid', k); });
  S.tx.forEach(function (t) { queue('tx', t.id); });
}

// The sheet stores names (readable); it maps them back to ids when the phones read it.
function txPayload(t) {
  var c = cardById(t.card), bm = billMonth(t), st = c && stmtDay(c) ? statement(c, bm) : null;
  return { id: t.id, date: t.date, card: c ? c.name : '', cardId: t.card, amount: +t.amount, kind: t.kind, category: t.category || '',
           note: t.note || '', billMonth: bm, cycle: st ? dayLabel(st.start) + ' – ' + dayLabel(st.end) : 'Calendar month',
           for: personName(whoOf(t)), by: personName(t.by) };
}
function cardPayload(c) {
  return { id: c.id, name: c.name, type: c.type, stmtDay: c.stmtDay || '', dueDay: c.dueDay || '', limit: c.limit || '', color: c.color || '',
           owner: c.owner === 'family' ? 'Joint' : personName(c.owner) };
}
function opPayload(o) {
  var v;
  if (o.k === 'tx') { v = txById(o.id); return { k: 'tx', id: o.id, tx: v ? txPayload(v) : null }; }
  if (o.k === 'card') { v = cardById(o.id); return { k: 'card', id: o.id, card: v ? cardPayload(v) : null }; }
  if (o.k === 'person') { v = personById(o.id); return { k: 'person', id: o.id, person: v ? { id: v.id, name: v.name } : null }; }
  if (o.k === 'budget') return { k: 'budget', id: o.id, v: S.budgets[o.id] || null };
  return { k: 'paid', id: o.id, v: S.paid[o.id] || null };
}

function api(body, conn) {
  conn = conn || S.sync;
  return fetch(conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
                           body: JSON.stringify(Object.assign({ k: conn.key }, body)) })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var j;
      try { j = JSON.parse(text); } catch (e) { throw new Error('The sheet didn\'t answer. Check that the script is deployed as a Web app with access "Anyone".'); }
      if (!j.ok) {
        if (j.error === 'bad-key') throw new Error('The connection link is not valid any more. Get a new one from the sheet.');
        if (j.error === 'unknown-action') throw new Error('Your sheet\'s script is older than the app. Paste the new Code.gs into the sheet and deploy a new version (see the guide).');
        throw new Error('Sheet error: ' + j.error);
      }
      return j;
    }, function () { throw new Error(navigator.onLine ? 'Could not reach Google. Check the connection link.' : 'You are offline.'); });
}

// Replace this phone's copy with the sheet's, keeping changes that are still waiting to be sent.
function applySnapshot(j) {
  var pend = {};
  S.sync.ops.forEach(function (o) { pend[o.k + '|' + o.id] = 1; });
  var merge = function (k, remote, local) {
    var out = remote.filter(function (x) { return !pend[k + '|' + x.id]; });
    local.forEach(function (x) { if (pend[k + '|' + x.id]) out.push(x); });
    return out;
  };
  var srvBm = {};
  S.people = merge('person', (j.people || []).map(function (p) { return { id: String(p.id), name: String(p.name) }; }), S.people);
  S.cards = merge('card', (j.cards || []).map(function (c, i) {
    var old = cardById(c.id);
    return { id: c.id, name: c.name, type: CARD_TYPES.indexOf(c.type) >= 0 ? c.type : 'Debit', stmtDay: +c.stmtDay || '', dueDay: +c.dueDay || '',
             dueDays: '', limit: +c.limit || '', color: c.color || (old && old.color) || CARD_COLORS[i % CARD_COLORS.length], owner: c.owner || '' };
  }), S.cards);
  S.tx = merge('tx', (j.tx || []).map(function (t) {
    srvBm[t.id] = t.billMonth || '';
    return { id: t.id, date: t.date, card: t.card, amount: +t.amount, kind: KINDS.indexOf(t.kind) >= 0 ? t.kind : 'Expense',
             category: t.category || '', note: t.note || '', for: t.for || '', by: t.by || '' };
  }), S.tx);
  ['budget', 'paid'].forEach(function (k) {
    var f = k === 'budget' ? 'budgets' : 'paid', r = Object.assign({}, j[f] || {});
    Object.keys(pend).forEach(function (key) {
      if (key.indexOf(k + '|') !== 0) return;
      var id = key.slice(k.length + 1);
      if (S[f][id]) r[id] = S[f][id]; else delete r[id];
    });
    S[f] = r;
  });
  if (!cardById(S.lastCard)) S.lastCard = S.cards.length ? cardsSorted()[0].id : null;
  clearBm();
  // Rows the sheet holds without this app's bill month (e.g. imported old rows) get it written back once.
  S.tx.forEach(function (t) { if (t.id in srvBm && srvBm[t.id] !== billMonth(t) && cardById(t.card)) queue('tx', t.id); });
}

var syncing = false, syncTimer = null, lastPull = 0, staleView = false;
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(function () { syncNow(false); }, ms == null ? 800 : ms); }

function syncNow(manual) {
  if (!syncOn() || syncing) return Promise.resolve();
  if (navigator.onLine === false) { syncStatusChanged(); if (manual) toast('You are offline. Changes will be sent when you are back online.'); return Promise.resolve(); }
  var sy = S.sync, sent = sy.ops.slice();
  syncing = true; syncStatusChanged();
  return api({ action: 'sync', rev: sy.rev || '', ops: sent.map(opPayload) }).then(function (j) {
    if (S.sync !== sy) return;   // disconnected or wiped while the request was out
    sy.ops = sy.ops.filter(function (o) { return sent.indexOf(o) < 0; });
    if (!j.same) applySnapshot(j);
    sy.rev = j.rev || ''; sy.last = toLocal(new Date()); sy.error = ''; if (j.sheetUrl) sy.sheetUrl = j.sheetUrl;
    lastPull = Date.now();
    save();
    if (!j.same) refreshView();
    if (manual) toast('Synced with Google Sheet');
  }, function (e) {
    if (S.sync !== sy) return;
    sy.error = e.message; save();
    if (manual) toast(e.message);
  }).then(function () {
    syncing = false; syncStatusChanged();
    if (S.sync === sy && !sy.error && sy.ops.length) scheduleSync(1500);
  });
}

// Redraw after the other phone's changes arrive, without yanking an open form or a field being typed in.
function refreshView() {
  var a = document.activeElement;
  if ($('#sheetRoot').innerHTML || (a && a.tagName === 'INPUT' && $('#view').contains(a))) { staleView = true; return; }
  staleView = false; render();
}

function syncStatusChanged() {
  var dot = $('#syncDot');
  if (dot) {
    var st = syncState();
    dot.hidden = !syncOn();
    dot.className = 'sync-dot ' + st.tone;
    dot.title = st.text;
    dot.setAttribute('aria-label', st.text);
  }
  if (ui.tab === 'settings' && !$('#sheetRoot').innerHTML) render();
}
function syncState() {
  if (!syncOn()) return { tone: '', text: 'Not connected' };
  var n = pendingCount(), sy = S.sync;
  if (syncing) return { tone: 'busy', text: 'Syncing with Google Sheet…' };
  if (sy.error) return { tone: 'bad', text: sy.error };
  if (n) return { tone: 'wait', text: n + (n === 1 ? ' change' : ' changes') + ' waiting' + (navigator.onLine === false ? ': will send when you are online' : '') };
  return { tone: 'ok', text: 'Everything synced' + (sy.last ? ' · last at ' + sy.last.slice(11) + ' on ' + dayLabel(parseLocal(sy.last)) : '') };
}

function parseConnLink(s) {
  var m = /^(https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec)\?k=([\w-]+)\s*$/.exec(String(s || '').trim());
  return m ? { url: m[1], key: m[2] } : null;
}

function openConnect() {
  var html = '<div class="row"><h3>Connect Google Sheet</h3><button type="button" class="linkish" id="xClose">Cancel</button></div>' +
    '<p class="small muted" style="margin:0">In your copy of the Selavu sheet choose <b>Selavu → Get connection link for the app</b>, copy the link, and paste it here. ' +
    'To share one sheet with your family, paste the same link on each phone.</p>' +
    '<label class="f" for="cLink">Connection link<textarea class="in" id="cLink" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" style="resize:none;font-size:16px"></textarea></label>' +
    '<p class="small" id="cMsg" style="margin:0" aria-live="polite"></p>' +
    '<button type="button" class="btn block" id="cGo">Connect</button>';
  openSheet(html, function (sh) {
    var msg = $('#cMsg', sh), go = $('#cGo', sh);
    $('#xClose', sh).addEventListener('click', closeSheet);
    go.addEventListener('click', function () {
      var raw = $('#cLink', sh).value.trim(), conn = parseConnLink(raw);
      if (!conn) {
        msg.textContent = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/.test(raw)
          ? 'This is the Web app URL, not the connection link yet. In your Google Sheet choose Selavu → 2. Get connection link for the app, paste this URL there, then copy the link it shows (it ends with ?k=…).'
          : 'That isn\'t a connection link. Get it from your Google Sheet: Selavu → 2. Get connection link for the app. It starts with https://script.google.com/macros/s/ and ends with ?k=…';
        msg.className = 'small up'; return;
      }
      go.disabled = true; go.textContent = 'Checking…'; msg.textContent = ''; msg.className = 'small';
      api({ action: 'ping' }, conn).then(function (j) {
        if (!j.v || j.v < 3) throw new Error('Your sheet\'s script is older than the app. Paste the new Code.gs into the sheet and deploy a new version (see the guide).');
        closeSheet();
        afterConnect(conn, j);
      }).catch(function (e) { go.disabled = false; go.textContent = 'Connect'; msg.textContent = e.message; msg.className = 'small up'; });
    });
  });
}

function afterConnect(conn, ping) {
  if (S.sample) S = blank();
  var here = S.tx.length, there = ping.count || 0;
  if (!(there && here)) { connectAndMerge(conn, ping, true); return; }
  openSheet('<h3>Both have entries</h3><p class="muted" style="margin:0">This phone has <b>' + here + (here === 1 ? ' entry' : ' entries') + '</b> and "' + esc(ping.name || 'your sheet') + '" has <b>' + there + '</b>.</p>' +
    '<button type="button" class="btn block" id="aMerge">Add this phone\'s entries to the sheet</button>' +
    '<button type="button" class="btn ghost block" id="aSheet">Use only the sheet (removes this phone\'s ' + here + ')</button>' +
    '<button type="button" class="btn ghost block" id="aNo">Cancel</button>' +
    '<p class="small muted" style="margin:0">People with the same name are joined, not duplicated.</p>', function (sh) {
    $('#aNo', sh).addEventListener('click', closeSheet);
    $('#aMerge', sh).addEventListener('click', function () { closeSheet(); connectAndMerge(conn, ping, true); });
    $('#aSheet', sh).addEventListener('click', function () { closeSheet(); connectAndMerge(conn, ping, false); });
  });
}

function connectAndMerge(conn, ping, keepLocal) {
  if (!keepLocal) S = blank();
  var backup = S.sync;
  S.sync = Object.assign(blank().sync, { url: conn.url, key: conn.key, sheetUrl: ping.sheetUrl || '' });
  toast('Connecting…');
  var mine = { tx: S.tx.map(function (t) { return t.id; }), cards: S.cards.map(function (c) { return c.id; }) };
  return api({ action: 'sync', rev: '', ops: [] }).then(function (j) {
    joinByName(j);
    queueAll();
    applySnapshot(j);
    S.sync.rev = '';
    save(); ui.tab = 'home'; ui.who = ''; render(); syncStatusChanged();
    var go = function () {
      return syncNow(false).then(function () {
        if (S.sync.error) { toast(S.sync.error); return; }
        toast('Connected · ' + S.tx.length + ' entries' + (S.people.length > 1 ? ' for ' + S.people.map(function (p) { return p.name; }).join(' & ') : ''));
        var noDay = S.cards.filter(function (c) { return c.type === 'Credit' && !c.stmtDay; });
        if (noDay.length) { ui.tab = 'settings'; render(); toast('Set the statement day for ' + noDay.map(function (c) { return c.name; }).join(', ')); }
      });
    };
    if (!personById(S.me)) openWho(go, mine); else go();
  }, function (e) { S.sync = backup; save(); render(); toast(e.message); });
}

// When joining a sheet, a person this phone already has under the same name becomes the sheet's one.
function joinByName(j) {
  var byName = function (list) { var m = {}; (list || []).forEach(function (x) { m[String(x.name).toLowerCase()] = String(x.id); }); return m; };
  // Cards are never joined by name: two people may each have a card called "HDFC UPI".
  var rp = byName(j.people);
  S.people = S.people.filter(function (p) {
    var rid = rp[p.name.toLowerCase()];
    if (!rid || rid === p.id) return true;
    S.tx.forEach(function (t) { if (t.for === p.id) t.for = rid; if (t.by === p.id) t.by = rid; });
    S.cards.forEach(function (c) { if (c.owner === p.id) c.owner = rid; });
    if (S.me === p.id) S.me = rid;
    return false;
  });
}

function confirmRestore() {
  openSheet('<h3>Reload from Google Sheet?</h3><p class="muted" style="margin:0">This replaces everything on this phone with what is in the sheet.' +
    (pendingCount() ? ' <b>' + pendingCount() + ' changes on this phone have not reached the sheet yet and will be lost.</b>' : '') + '</p>' +
    '<button type="button" class="btn block" id="pYes">Reload from sheet</button><button type="button" class="btn ghost block" id="pNo">Cancel</button>', function (sh) {
    $('#pNo', sh).addEventListener('click', closeSheet);
    $('#pYes', sh).addEventListener('click', function () { closeSheet(); restoreFromSheet(); });
  });
}

function restoreFromSheet() {
  S.sync.ops = []; S.sync.rev = ''; S.sync.error = ''; save();
  toast('Reading your Google Sheet…');
  return syncNow(false).then(function () {
    if (S.sync.error) { toast(S.sync.error); return; }
    ui.tab = 'home'; render();
    toast(S.tx.length + ' entries loaded from your sheet');
  });
}

window.addEventListener('online', function () { syncStatusChanged(); scheduleSync(300); });
window.addEventListener('offline', syncStatusChanged);
// Pick up the other phone's entries: when the app comes back to the front, and every 2 minutes while open.
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && (pendingCount() || Date.now() - lastPull > 15000)) scheduleSync(300); });
setInterval(function () { if (document.visibilityState === 'visible' && syncOn() && Date.now() - lastPull > 110000) syncNow(false); }, 30000);

// ---------- Sample data ----------
function loadSample() {
  var cards = [
    { id: 'sbi', name: 'SBI Credit Card', type: 'Credit', stmtDay: 23, dueDay: 12, limit: 150000, color: CARD_COLORS[0] },
    { id: 'axis', name: 'Axis Credit Card', type: 'Credit', stmtDay: 18, dueDay: 5, limit: 100000, color: CARD_COLORS[1] },
    { id: 'upi', name: 'Bank UPI', type: 'UPI', stmtDay: '', dueDays: '', limit: '', color: CARD_COLORS[2] },
    { id: 'cash', name: 'Cash', type: 'Cash', stmtDay: '', dueDays: '', limit: '', color: CARD_COLORS[7] }
  ];
  var plan = [['Food & Dining', 'Swiggy', 450, 'sbi'], ['Groceries', 'Zepto', 820, 'upi'], ['Fuel', 'Petrol', 1500, 'axis'], ['Food & Dining', 'Lunch', 260, 'upi'],
    ['Shopping', 'Amazon', 2499, 'sbi'], ['Bills & Utilities', 'Electricity', 1800, 'upi'], ['Groceries', 'Vegetables', 340, 'cash'], ['Subscriptions', 'Netflix', 649, 'axis'],
    ['Travel', 'Train tickets', 1240, 'sbi'], ['Health', 'Pharmacy', 560, 'upi'], ['Entertainment', 'Movie', 700, 'axis'], ['Food & Dining', 'Dinner out', 1350, 'sbi']];
  var tx = [], now = new Date(), seed = 7;
  var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (var back = 85; back >= 0; back -= 2) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back, 9 + Math.floor(rnd() * 12), Math.floor(rnd() * 60));
    var p = plan[Math.floor(rnd() * plan.length)];
    tx.push({ id: uid(), date: toLocal(d), card: p[3], amount: Math.round(p[2] * (0.6 + rnd() * 0.8)), kind: 'Expense', category: p[0], note: p[1] });
  }
  tx.push({ id: uid(), date: toLocal(new Date(now.getFullYear(), now.getMonth(), Math.max(now.getDate() - 10, 1), 18, 0)), card: 'upi', amount: 10000, kind: 'Expense', category: 'Rent & Housing', note: 'House rent' });
  tx.push({ id: uid(), date: toLocal(new Date(now.getFullYear(), now.getMonth(), Math.max(now.getDate() - 6, 1), 20, 0)), card: 'upi', amount: 2000, kind: 'Lent', category: '', note: 'Friend' });
  // Sample data is never synced (syncOn() is false while sample is set), but keep any sheet connection.
  S = keepSync(Object.assign(blank(), { cards: cards, tx: tx, budgets: { 'Food & Dining': 6000, 'Groceries': 5000, 'Fuel': 4000 }, lastCard: 'sbi', sample: true }));
  save(); render(); toast('Sample data loaded. Clear it any time.');
}

// ---------- Deep links: #add or ?amount=…&card=…&category=…&note=…&kind=… ----------
function handleLink() {
  var params = new URLSearchParams(location.search), hash = location.hash.replace('#', '');
  if (hash !== 'add' && !params.has('amount') && !params.has('add')) return;
  var pre = {};
  var amt = +String(params.get('amount') || '').replace(/[₹,\s]/g, ''); if (amt > 0) pre.amount = amt;
  var cn = (params.get('card') || '').toLowerCase();
  if (cn) S.cards.forEach(function (c) { if (c.name.toLowerCase() === cn) pre.card = c.id; });
  var cat = params.get('category') || ''; if (CATS.indexOf(cat) >= 0) pre.category = cat;
  var k = params.get('kind') || ''; if (KINDS.indexOf(k) >= 0) pre.kind = k;
  if (params.get('note')) pre.note = params.get('note');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  openExpense(null, pre);
}
window.addEventListener('hashchange', handleLink);

// ---------- Boot ----------
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
window.__selavu = { billMonthFor: billMonthFor, statement: statement, parseConnLink: parseConnLink, syncNow: syncNow, state: function () { return S; }, migrate: migrate };
render();
syncStatusChanged();
handleLink();
scheduleSync(1000);
})();
</script>
