<title>Selavu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first app shell — sticky month header, scrolling cards, fixed bottom tab bar, bottom-sheet forms. */
:root {
  /* Light: warm ivory with deep gold. Dark (default look of the icon): black with gold. */
  --bg: #f4f1ea; --surface: #ffffff; --surface-2: #f8f6f1; --fg: #17150f; --muted: #6b6558; --line: #e7e1d4;
  --accent: #8a6a1e; --accent-fg: #ffffff; --accent-soft: #f3ead6;
  --gold: linear-gradient(135deg, #f0d48c 0%, #c99d48 55%, #a07832 100%); --gold-fg: #1a1407;
  --hero: linear-gradient(160deg, #fffaf0 0%, #ffffff 60%);
  --brand: linear-gradient(135deg, #b8903c 0%, #7a5814 100%);
  --good: #1f7a50; --warn: #b4580f; --bad: #c2392f; --warn-soft: #fbecdd; --bad-soft: #fbe5e3; --good-soft: #e2f2e9;
  --shadow: 0 1px 2px rgba(40,30,10,.05), 0 6px 20px rgba(40,30,10,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --display: "Montserrat", var(--font);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0b; --surface: #141416; --surface-2: #1b1b1e; --fg: #f3efe6; --muted: #9d978a; --line: #29292d;
  --accent: #d6b25e; --accent-fg: #15120a; --accent-soft: #2a2415;
  --hero: radial-gradient(120% 90% at 100% 0%, rgba(214,178,94,.16) 0%, rgba(214,178,94,0) 55%), #141416; --brand: var(--gold);
  --good: #6cc59a; --warn: #f0954f; --bad: #ef7d73; --warn-soft: #2e1f14; --bad-soft: #321b1a; --good-soft: #15291f;
  --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0a0b; --surface: #141416; --surface-2: #1b1b1e; --fg: #f3efe6; --muted: #9d978a; --line: #29292d;
  --accent: #d6b25e; --accent-fg: #15120a; --accent-soft: #2a2415;
  --hero: radial-gradient(120% 90% at 100% 0%, rgba(214,178,94,.16) 0%, rgba(214,178,94,0) 55%), #141416; --brand: var(--gold);
  --good: #6cc59a; --warn: #f0954f; --bad: #ef7d73; --warn-soft: #2e1f14; --bad-soft: #321b1a; --good-soft: #15291f;
  --shadow: none; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Text boxes must be 16px or larger, or iPhone zooms the page when one is tapped. */
input, select, textarea { font-size: max(16px, 1em); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); margin: 0; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 720px; margin: 0 auto; }
.brand { font: 400 19px/1 var(--display); letter-spacing: .26em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand .word { background: var(--brand, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.sync-dot.ok { background: var(--good); } .sync-dot.wait { background: var(--warn); } .sync-dot.bad { background: var(--bad); }
.sync-dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .sync-dot.busy { animation: none; } }
.sync-line { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.month button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.month span { min-width: 92px; text-align: center; font-weight: 600; font-size: 14px; }

main { max-width: 720px; margin: 0 auto; padding-block: 4px calc(var(--nav-h) + 88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card.hero { background: var(--hero); border-color: var(--line); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.big { font: 600 38px/1.1 var(--display); letter-spacing: -.01em; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.kpi b { font: 600 16px var(--display); }
.kpi span { font-size: 12px; color: var(--muted); }
.up { color: var(--bad); } .down { color: var(--good); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s ease; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }

.cc { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.cc-head { display: flex; align-items: center; gap: 10px; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.cc-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.good { background: transparent; color: var(--good); border: 1px solid currentColor; }
.cc-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }

.donut-wrap { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }
.legend { display: grid; gap: 8px; min-width: 0; }
.leg { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.leg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leg .meter { grid-column: 2 / 4; height: 5px; }
.chips.who-bar { margin: 0 -16px 2px; padding: 0 16px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.who-bar::-webkit-scrollbar { display: none; }
.who-bar .chip { flex: none; }
.who-bar .chip { padding: 6px 12px; }
.who-row { grid-template-columns: 1fr auto; border: 0; background: none; padding: 0; color: inherit; text-align: left; font: inherit; }
.who-row .meter { grid-column: 1 / 3; }
svg text { fill: var(--muted); font: 11px var(--font); }
svg .lbl-strong { fill: var(--fg); font-weight: 700; font-size: 18px; }

.list { display: grid; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 4px 6px; }
.tx { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.tx:last-child { border-bottom: 0; }
.ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; line-height: 1; }
.tx .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { font: 600 15px var(--display); text-align: right; }
.tx .amt.other { color: var(--muted); font-style: italic; }
.tx > div { min-width: 0; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 6px 0; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs .add { width: 56px; height: 56px; border-radius: 50%; background: var(--gold); color: var(--gold-fg); display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 8px 22px rgba(201,157,72,.38); transition: transform .15s; }
nav.tabs button:active .add { transform: scale(.94); }
nav.tabs .add svg { width: 28px; height: 28px; stroke-width: 2.4; }

.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--gold); color: var(--gold-fg); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

.sheet-back { position: fixed; inset: 0; background: rgba(8,12,18,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto;
  border-radius: 20px 20px 0 0; padding-block: 10px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-foot { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); z-index: 1; display: grid; gap: 8px; background: var(--surface);
  padding: 10px 0 calc(20px + env(safe-area-inset-bottom, 0px)); margin: -4px 0 calc(-20px - env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 12px -10px rgba(0,0,0,.25); }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto; }
.sheet h3 { margin: 0; font: 600 19px var(--display); }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.in { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; color: var(--fg); }
.amount-in { font: 600 40px var(--display); text-align: center; border: 0; background: none; padding: 4px; width: 100%; color: var(--fg); }
.amount-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; font: 500 40px var(--display); color: var(--muted); border-bottom: 2px solid var(--line); }
.amount-wrap:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip .em { font-size: 15px; line-height: 1; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.chip .swatch { width: 9px; height: 9px; border-radius: 50%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); outline: 1px solid var(--line); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.daybtn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; cursor: pointer; }
.daybtn[aria-expanded="true"] { border-color: var(--accent); }
.daygrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.daygrid button { aspect-ratio: 1; min-height: 36px; border: 0; border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 15px; color: var(--fg); padding: 0; }
.daygrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.banner { background: var(--warn-soft); color: var(--fg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 10px; justify-items: center; }
.empty p { margin: 0; max-width: 34ch; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row > div { min-width: 0; }
.budget-grid { display: grid; grid-template-columns: 1fr 120px; gap: 8px 12px; align-items: center; }
.budget-grid .in { padding: 8px 10px; font-size: 16px; }
.stmt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.stmt:last-child { border-bottom: 0; }
.toggle { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }

/* Wallet-style card tiles (Home): swipe sideways */
.ctiles { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.ctiles::-webkit-scrollbar { display: none; }
.ctile { flex: 0 0 min(82%, 320px); scroll-snap-align: start; aspect-ratio: 1.6; border-radius: 18px; padding: 16px; color: #fff; position: relative; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.ctile::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; top: -90px; background: rgba(255,255,255,.09); pointer-events: none; }
.ctile .t-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctile .t-name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctile .t-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.2); white-space: nowrap; }
.ctile .t-tag.bad { background: #fff; color: #b3261e; }
.ctile .t-amt { align-self: center; font: 600 28px/1.1 var(--display); letter-spacing: -.01em; }
.ctile .t-sub { font-size: 12px; opacity: .85; }
.ctile .t-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.ctile .ring { width: 46px; height: 46px; flex: none; }
.ctile .ring text { fill: #fff; font: 600 11px var(--display); }
.ctile .owner { font-size: 11px; opacity: .85; }

/* Insights */
.ins { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 2px 0; }
.ins .i { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; background: var(--surface-2); }
.ins.bad .i { background: var(--bad-soft); } .ins.good .i { background: var(--good-soft); } .ins.warn .i { background: var(--warn-soft); }
.ins p { margin: 0; font-size: 14px; line-height: 1.45; }
.ins p b { font-weight: 600; }
.ins .tip { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* Quick add on the add screen */
.quick { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 0 16px 2px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 8px 12px; text-align: left; display: grid; gap: 1px; max-width: 170px; }
.quick button b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quick button span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quick button.on { border-color: var(--accent); background: var(--accent-soft); }
#view > * { animation: fade .25s ease-out both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view > * { animation: none; } .meter i { transition: none; } }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
</style>

  '#7d8a99', '#b85cb0', '#e09a2f', '#4d9b3a', '#c77d64', '#2f6fb3', '#9aa4b0'];
var CAT_ICONS = ['🍔', '🛒', '⛽', '✈️', '🛍️', '💡', '🏠', '🔧', '💊', '📺', '🏦', '🎬', '🎁', '🏸', '💇', '📈', '📦'];
var KINDS = ['Expense', 'Transfer', 'Lent', 'Received'];
var KIND_ICONS = { Transfer: '🔁', Lent: '🤝', Received: '💰' };
var CARD_TYPES = ['Credit', 'Debit', 'UPI', 'Cash'];
var CARD_COLORS = ['#2f6fb3', '#e07b39', '#3a9d6e', '#8a5cc2', '#c9473d', '#c99a1c', '#3b9fb5', '#7d8a99'];
// Free text (from imports or a Shortcut) → [kind, category]
var MAP = { 'outside food': ['Expense', 'Food & Dining'], 'zomato': ['Expense', 'Food & Dining'], 'swiggy': ['Expense', 'Food & Dining'],
  'snacks erode': ['Expense', 'Food & Dining'], 'zepto': ['Expense', 'Groceries'], 'blinkit': ['Expense', 'Groceries'],
  'vegetables': ['Expense', 'Groceries'], 'chicken': ['Expense', 'Groceries'], 'market purchase': ['Expense', 'Groceries'],
  'emi': ['Expense', 'EMI & Loans'], 'rent': ['Expense', 'Rent & Housing'], 'rental agreement': ['Expense', 'Rent & Housing'],
  'bathroom pipe': ['Expense', 'Home & Repairs'], 'tv installation': ['Expense', 'Home & Repairs'], 'mattress purchase': ['Expense', 'Shopping'],
  'dress purchase': ['Expense', 'Shopping'], 'phone temper': ['Expense', 'Shopping'], 'amazon': ['Expense', 'Shopping'], 'flipkart': ['Expense', 'Shopping'],
  'decathlon purchase': ['Expense', 'Sports & Fitness'], 'sports': ['Expense', 'Sports & Fitness'], 'pangu marriage': ['Expense', 'Gifts & Functions'],
  'malli poo': ['Expense', 'Personal'], 'chit amount': ['Transfer', 'Savings & Investments'], 'srikanth transfer': ['Transfer', 'Other'],
  'lent to friend': ['Lent', 'Other'], 'received amount': ['Received', 'Other'], 'reimbursement received': ['Received', 'Other'],
  'cash / atm': ['Transfer', 'Other'], 'cash': ['Transfer', 'Other'], 'atm': ['Transfer', 'Other'] };

var inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// ---------- State ----------
var S = load();
var ui = { tab: 'home', ym: ymOf(new Date()), q: '', cardFilter: '', who: '' };

// people: the household ({id, name}); me: who uses THIS phone (never synced).
// Entry: for = person id or 'family' (whose spending it is), by = who logged it. Card: owner = person id or 'family' (joint).
function blank() {
  return { v: 1, cards: [], tx: [], budgets: {}, paid: {}, people: [], me: '', lastCard: null, sample: false,
           sync: { url: '', key: '', sheetUrl: '', ops: [], rev: '', last: '', error: '' } };
}
function load() {
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) return migrate(Object.assign(blank(), s)); }
  } catch (e) { /* storage blocked: run in memory */ }
  return blank();
}
// Older versions queued {op, id} and whole-list "meta"/"full" flags; turn them into per-item changes.
function migrate(s) {
  var sy = s.sync = Object.assign(blank().sync, s.sync), ops = [];
  var add = function (k, id) { if (!ops.some(function (o) { return o.k === k && o.id === id; })) ops.push({ k: k, id: id }); };
  (sy.ops || []).forEach(function (o) { add(o.k || 'tx', o.id); });
  if (sy.meta || sy.full) {
    s.cards.forEach(function (c) { add('card', c.id); });
    Object.keys(s.budgets).forEach(function (k) { add('budget', k); });
    Object.keys(s.paid).forEach(function (k) { add('paid', k); });
  }
  if (sy.full) s.tx.forEach(function (t) { add('tx', t.id); });
  sy.ops = ops; delete sy.meta; delete sy.full;
  s.people = s.people || [];
  return s;
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('Could not save on this device. Export a backup from Settings.'); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---------- Dates & cycles ----------
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function ymAdd(ym, n) { var p = ym.split('-'); return ymOf(new Date(+p[0], +p[1] - 1 + n, 1)); }
function ymLabel(ym) { var p = ym.split('-'); return MON[+p[1] - 1] + ' ' + p[0]; }
function ymShort(ym) { var p = ym.split('-'); return MON[+p[1] - 1] + ' ' + p[0].slice(2); }
function parseLocal(s) { var m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : new Date(NaN); }
function toLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayLabel(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function today0() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }

function cardById(id) { for (var i = 0; i < S.cards.length; i++) if (S.cards[i].id === id) return S.cards[i]; return null; }
// ---------- People ----------
// Household categories default to "Family" when a new entry is logged (until the For choice is tapped).
var SHARED_CATS = ['Groceries', 'Rent & Housing', 'Bills & Utilities', 'Home & Repairs'];
// Paid about once a month, so insights don't project them forward day by day.
var FIXED_CATS = ['Rent & Housing', 'EMI & Loans', 'Bills & Utilities', 'Subscriptions', 'Savings & Investments'];
function personById(id) { for (var i = 0; i < S.people.length; i++) if (S.people[i].id === id) return S.people[i]; return null; }
function personName(id) { return id === 'family' ? 'Family' : (personById(id) || {}).name || ''; }
function shared() { return S.people.length >= 2; }
// Once this phone knows whose it is, it shows only that person's cards and spending.
// Everyone's entries still go to (and come back from) the shared Google Sheet.
function personal() { return !!personById(S.me); }
function visible(t) { return !personal() || t.by === S.me || (!t.by && whoOf(t) === S.me); }
function myCard(c) { return !personal() || c.owner === S.me || !c.owner || c.owner === 'family'; }
function myCards() { return S.cards.filter(myCard); }
function myTx() { return S.tx.filter(visible); }
// "Spent by" choices: on a personal phone just Me or Family (shared cost).
function whoChoices() {
  var ppl = personal() ? [personById(S.me)] : S.people;
  return ppl.map(function (p) { return { id: p.id, name: p.name }; }).concat([{ id: 'family', name: 'Family' }]);
}
// Whose spending an entry is: its own tag, else the card owner.
function whoOf(t) { if (t.for) return t.for; var c = cardById(t.card); return (c && c.owner) || ''; }
function scope(list) {
  if (personal()) return list.filter(visible);
  return ui.who ? list.filter(function (t) { return whoOf(t) === ui.who; }) : list;
}
// This phone's cards first, then joint, then the others.
// Budgets are per person on a personal phone (stored as "personId|Category"), otherwise for the household.
function budgetKey(cat) { return personal() ? S.me + '|' + cat : cat; }
function budget(cat) { return +S.budgets[budgetKey(cat)] || 0; }

function cardsSorted() {
  var rank = function (c) { return c.owner === S.me ? 0 : (!c.owner || c.owner === 'family') ? 1 : 2; };
  return myCards().map(function (c, i) { return [rank(c), i, c]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (x) { return x[2]; });
}

function stmtDay(card) { return card && card.type === 'Credit' ? (+card.stmtDay || 0) : 0; }

// Bill month = month the statement is made. Statement-day purchases go to the next cycle.
function billMonthFor(card, d) {
  var s = stmtDay(card);
  if (!s) return ymOf(d);
  return ymOf(new Date(d.getFullYear(), d.getMonth() + (d.getDate() >= s ? 1 : 0), 1));
}
function billMonth(t) { return t._bm || (t._bm = billMonthFor(cardById(t.card), parseLocal(t.date))); }
function clearBm() { S.tx.forEach(function (t) { delete t._bm; }); }
// Statement made in month `ym` for a credit card.
function statement(card, ym) {
  var p = ym.split('-'), y = +p[0], m = +p[1] - 1, s = stmtDay(card);
  var date = new Date(y, m, s);
  return { ym: ym, start: new Date(y, m - 1, s), end: new Date(y, m, s - 1), date: date, due: dueDate(card, date) };
}
// First occurrence of the due day after the statement date (clamped to short months).
// Older cards saved "days after statement" instead; keep honouring that.
function dueDate(card, date) {
  var d = +card.dueDay;
  if (d) {
    var y = date.getFullYear(), m = date.getMonth() + (d <= date.getDate() ? 1 : 0);
    return new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate()));
  }
  return card.dueDays ? addDays(date, +card.dueDays) : null;
}
var counts = function (t) { return t.kind !== 'Received'; };

// ---------- Queries ----------
function sum(list) { return list.reduce(function (a, t) { return a + (+t.amount || 0); }, 0); }
function inMonth(ym) { return S.tx.filter(function (t) { return billMonth(t) === ym; }); }
function expenses(list) { return list.filter(function (t) { return t.kind === 'Expense'; }); }
function chargedOn(cardId, ym) { return sum(S.tx.filter(function (t) { return t.card === cardId && billMonth(t) === ym && counts(t); })); }

// ---------- Rendering helpers ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function catColor(c) { var i = CATS.indexOf(c); return i < 0 ? '#9aa4b0' : CAT_COLORS[i]; }
function catIcon(c) { var i = CATS.indexOf(c); return i < 0 ? '📦' : CAT_ICONS[i]; }
function txIcon(t) { return t.kind === 'Expense' ? catIcon(t.category) : KIND_ICONS[t.kind] || '💸'; }
// Darken (-) or lighten (+) a #rrggbb colour by a fraction.
function shade(hex, f) {
  var n = parseInt(String(hex || '#7d8a99').slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  var m = function (v) { return Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f); };
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}
// A row of choices: a segmented control for up to 3, wrapping chips beyond that.
function choices(id, items, selected) {
  var many = items.length > 3;
  return '<div class="' + (many ? 'chips' : 'seg') + '" id="' + id + '">' + items.map(function (it) {
    return '<button type="button"' + (many ? ' class="chip"' : '') + ' data-v="' + esc(it.id) + '" aria-pressed="' + (selected === it.id) + '">' + esc(it.name) + '</button>';
  }).join('') + '</div>';
}
function initials(s) { return esc(String(s || '?').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || '?'); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

var toastTimer;
function toast(msg) {
  var r = $('#toastRoot');
  r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { r.innerHTML = ''; }, 3200);
}

// ---------- Charts (SVG) ----------
function donut(parts, total) {
  var r = 56, c = 2 * Math.PI * r, off = 0;
  var segs = parts.map(function (p) {
    var len = total ? p.value / total * c : 0;
    var s = '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="20" stroke-dasharray="' +
      Math.max(len - 1.5, 0.01).toFixed(2) + ' ' + c.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 75 75)"/>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Spending by category">' +
    '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="20"/>' + segs +
    '<text x="75" y="72" text-anchor="middle" class="lbl-strong">' + esc(compact(total)) + '</text>' +
    '<text x="75" y="90" text-anchor="middle">spent</text></svg>';
}
function compact(n) {
  var t = function (x) { return String(+x.toFixed(1)); };
  return n >= 100000 ? '₹' + t(n / 100000) + 'L' : n >= 1000 ? '₹' + t(n / 1000) + 'k' : inr.format(n);
}
function niceMax(v) {
  if (v <= 0) return 1000;
  var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  var steps = [1, 1.5, 2, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) if (f <= steps[i]) return steps[i] * p;
  return 10 * p;
}

function stackedBars(cols, series, height) {
  // cols: [{label, values:[...per series]}], series: [{name,color}]
  var W = 640, H = height || 200, L = 44, B = 22, T = 8, R = 6;
  var max = niceMax(Math.max.apply(null, cols.map(function (c) { return c.values.reduce(function (a, b) { return a + b; }, 0); }).concat([0])));
  var bw = (W - L - R) / cols.length, inner = Math.min(bw * 0.62, 38);
  var y = function (v) { return T + (H - T - B) * (1 - v / max); };
  var out = '';
  [0, 0.5, 1].forEach(function (f) {
    var yy = y(max * f);
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(compact(max * f)) + '</text>';
  });
  cols.forEach(function (c, i) {
    var x = L + i * bw + (bw - inner) / 2, acc = 0;
    c.values.forEach(function (v, j) {
      if (!v) return;
      var y1 = y(acc + v), y0 = y(acc);
      out += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + inner.toFixed(1) + '" height="' + Math.max(y0 - y1, 0.5).toFixed(1) +
        '" fill="' + series[j].color + '"' + (c.dim ? ' opacity=".45"' : '') + '><title>' + esc(c.label + ' · ' + series[j].name + ': ' + inr.format(v)) + '</title></rect>';
      acc += v;
    });
    if (c.label) out += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (c.strong ? ' style="fill:var(--fg);font-weight:600"' : '') + '>' + esc(c.label) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Bar chart">' + out + '</svg>';
}

// ---------- Views ----------
function render() {
  $('#monthLbl').textContent = ymLabel(ui.ym);
  $('#monthNav').hidden = !(ui.tab === 'home' || ui.tab === 'history');
  $$('nav.tabs [data-tab]').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'); });
  var v = $('#view');
  v.innerHTML = ({ home: viewHome, history: viewHistory, bills: viewBills, settings: viewSettings })[ui.tab]();
  bindView(v);
}

function sampleBanner() {
  return S.sample ? '<div class="banner"><span>You are looking at <b>sample data</b>.</span><button type="button" class="linkish" data-act="clear-sample">Clear sample &amp; start fresh</button></div>' : '';
}

// All | each person | Family filter (shown once two or more people are set up).
function whoBar() {
  if (!shared() || personal()) return '';
  if (ui.who && ui.who !== 'family' && !personById(ui.who)) ui.who = '';
  return '<div class="chips who-bar" role="group" aria-label="Show spending of">' +
    [{ id: '', name: 'All' }].concat(whoChoices()).map(function (p) {
      return '<button type="button" class="chip" data-who="' + p.id + '" aria-pressed="' + (ui.who === p.id) + '">' + esc(p.name) + (p.id && p.id === S.me ? ' (me)' : '') + '</button>';
    }).join('') + '</div>';
}

function viewHome() {
  if (!myCards().length) {
    return '<section class="card empty"><div class="big" style="font-size:26px">Track every card, cycle by cycle</div>' +
      '<p class="muted">Add your cards once: credit cards with their statement day, plus debit, UPI or cash. Then log each payment in one tap.</p>' +
      '<div class="btns" style="width:100%"><button type="button" class="btn" data-act="new-card">Add my first card</button>' +
      '<button type="button" class="btn ghost" data-act="sample">Try with sample data</button></div></section>';
  }
  var ym = ui.ym, now = ymOf(new Date());
  var month = scope(inMonth(ym)), exp = expenses(month), spent = sum(exp);
  var last = sum(expenses(scope(inMonth(ymAdd(ym, -1)))));
  var change = last ? (spent / last - 1) : null;
  var p = ym.split('-'), dim = new Date(+p[0], +p[1], 0).getDate();
  var days = ym === now ? new Date().getDate() : dim;
  // Budgets are for the whole household, so they show only on the "All" view.
  var budgetTotal = ui.who ? 0 : CATS.reduce(function (a, c) { return a + budget(c); }, 0);

  var h = sampleBanner() + whoBar();
  h += '<section class="card hero"><div class="row"><h2>' + (ui.who ? esc(personName(ui.who)) + ' · ' : 'Spent in ') + esc(ymLabel(ym)) + ' bills</h2>' +
    (ym === now ? '<span class="pill">This month</span>' : ym > now ? '<span class="pill warn">Upcoming</span>' : '<span class="pill good">Closed</span>') + '</div>' +
    '<div class="big" data-count="' + spent + '">' + inr.format(spent) + '</div>' +
    (budgetTotal ? meter(spent, budgetTotal) + '<div class="small muted">' + inr.format(Math.max(budgetTotal - spent, 0)) + ' left of ' + inr.format(budgetTotal) + ' budget</div>' : '') +
    '<div class="kpis"><div class="kpi"><b>' + inr.format(last) + '</b><span>Last month</span></div>' +
    '<div class="kpi"><b class="' + (change == null ? '' : change > 0 ? 'up' : 'down') + '">' + (change == null ? '–' : (change > 0 ? '+' : '') + Math.round(change * 100) + '%') + '</b><span>Change</span></div>' +
    '<div class="kpi"><b>' + inr.format(days ? spent / days : 0) + '</b><span>Per day</span></div></div></section>';

  h += viewInsights(ym);

  // Who spent (household view)
  if (shared() && !personal() && !ui.who && spent) {
    var byWho = whoChoices().map(function (p) { return { id: p.id, name: p.name, v: sum(exp.filter(function (t) { return whoOf(t) === p.id; })) }; });
    var none = spent - byWho.reduce(function (a, p) { return a + p.v; }, 0);
    if (none > 0) byWho.push({ id: '', name: 'Not tagged', v: none });
    h += '<section class="card"><h2>Who spent</h2><div class="legend">' + byWho.filter(function (p) { return p.v; }).sort(function (a, b) { return b.v - a.v; }).map(function (p) {
      return '<button type="button" class="leg who-row"' + (p.id ? ' data-who="' + p.id + '"' : ' disabled') + '><span class="nm">' + esc(p.name) + '</span><b>' + inr.format(p.v) +
        ' <span class="small muted">' + Math.round(p.v / spent * 100) + '%</span></b>' + meter(p.v, spent) + '</button>';
    }).join('') + '</div></section>';
  }

  // Cards for this bill month: wallet-style tiles, swipe sideways
  if (myCards().length) {
    var t0 = today0();
    h += '<section class="card"><div class="row"><h2>Cards · ' + esc(ymLabel(ym)) + '</h2><span class="small muted">' + (myCards().length > 1 ? 'Swipe ›' : '') + '</span></div><div class="ctiles">';
    cardsSorted().forEach(function (c) {
      var amt = chargedOn(c.id, ym), tag = '', sub, foot = '';
      if (stmtDay(c)) {
        var st = statement(c, ym), paid = S.paid[c.id + '|' + ym];
        if (st.start > t0) tag = 'Not started';
        else if (st.date > t0) tag = Math.round((st.date - t0) / 864e5) + ' days to statement';
        else if (paid) tag = 'Paid ✓';
        else if (st.due && (st.due - t0) / 864e5 <= 3) tag = '<span class="t-tag bad">' + (st.due < t0 ? 'Overdue' : 'Due ' + dayLabel(st.due)) + '</span>';
        else tag = st.due ? 'Due ' + dayLabel(st.due) : 'Statement out';
        sub = dayLabel(st.start) + ' – ' + dayLabel(st.end);
      } else { tag = esc(c.type); sub = 'Calendar month'; }
      if (tag.charAt(0) !== '<') tag = '<span class="t-tag">' + tag + '</span>';
      if (c.limit) foot = ring(amt / c.limit);
      h += '<button type="button" class="ctile" data-cardhist="' + c.id + '" style="background:linear-gradient(135deg,' + shade(c.color, -0.05) + ' 0%,' + shade(c.color, -0.5) + ' 100%);border:0;text-align:left">' +
        '<div class="t-top"><span class="t-name">' + esc(c.name) + '</span>' + tag + '</div>' +
        '<div class="t-amt">' + inr.format(amt) + '</div>' +
        '<div class="t-foot"><div><div class="t-sub">' + sub + '</div>' +
        (shared() && !personal() && c.owner ? '<div class="owner">' + esc(c.owner === 'family' ? 'Joint' : personName(c.owner)) + '</div>' : '') +
        (c.limit ? '<div class="t-sub">of ' + inr.format(+c.limit) + ' limit</div>' : '') + '</div>' + foot + '</div></button>';
    });
    h += '</div></section>';
  }

  // Categories
  var byCat = {};
  exp.forEach(function (t) { byCat[t.category || 'Other'] = (byCat[t.category || 'Other'] || 0) + (+t.amount || 0); });
  var cats = Object.keys(byCat).map(function (k) { return { name: k, value: byCat[k], color: catColor(k) }; }).sort(function (a, b) { return b.value - a.value; });
  h += '<section class="card"><h2>Where it went</h2>';
  if (!cats.length) h += '<p class="muted small" style="margin:0">No spending in this bill month yet. Tap + to log one.</p>';
  else {
    h += '<div class="donut-wrap">' + donut(cats, spent) + '<div class="legend">' + cats.map(function (c) {
      var b = ui.who ? 0 : budget(c.name);
      return '<div class="leg"><span class="swatch" style="background:' + c.color + '"></span><span class="nm">' + catIcon(c.name) + ' ' + esc(c.name) + '</span><b>' + inr.format(c.value) + '</b>' +
        (b ? meter(c.value, b) : '') + '</div>';
    }).join('') + '</div></div>';
  }
  h += '</section>';

  // 6-month trend by card
  var series = myCards().map(function (c) { return { name: c.name, color: c.color }; });
  var cols = [];
  for (var i = -5; i <= 0; i++) {
    var m = ymAdd(ym, i), list = expenses(scope(inMonth(m)));
    cols.push({ label: ymShort(m), strong: i === 0, values: myCards().map(function (c) { return sum(list.filter(function (t) { return t.card === c.id; })); }) });
  }
  h += '<section class="card"><h2>Last 6 months by card</h2>' + stackedBars(cols, series) +
    '<div class="chips">' + series.map(function (s) { return '<span class="small muted" style="display:inline-flex;gap:6px;align-items:center"><span class="swatch" style="background:' + s.color + '"></span>' + esc(s.name) + '</span>'; }).join('') + '</div></section>';

  // Daily (calendar month)
  var daily = [];
  for (var d = 1; d <= dim; d++) {
    var dd = new Date(+p[0], +p[1] - 1, d);
    var v = sum(scope(S.tx).filter(function (t) { if (t.kind !== 'Expense') return false; var x = parseLocal(t.date); return x.getFullYear() === dd.getFullYear() && x.getMonth() === dd.getMonth() && x.getDate() === d; }));
    daily.push({ label: (d === 1 || d % 5 === 0) ? String(d) : '', values: [v], dim: dd > new Date() });
  }
  h += '<section class="card"><h2>Daily spend in ' + MON[+p[1] - 1] + ' (by date)</h2>' + stackedBars(daily, [{ name: 'Spent', color: 'var(--accent)' }], 160) + '</section>';

  // Not spending
  var tr = sum(month.filter(function (t) { return t.kind === 'Transfer'; }));
  var lent = sum(scope(S.tx).filter(function (t) { return t.kind === 'Lent'; })), back = sum(scope(S.tx).filter(function (t) { return t.kind === 'Received'; }));
  if (tr || lent || back) {
    h += '<section class="card"><h2>Not counted as spending</h2>' +
      '<div class="kpis"><div class="kpi"><b>' + inr.format(tr) + '</b><span>Transfers this month</span></div>' +
      '<div class="kpi"><b>' + inr.format(lent) + '</b><span>Lent (all time)</span></div>' +
      '<div class="kpi"><b>' + inr.format(Math.max(lent - back, 0)) + '</b><span>Still to get back</span></div></div></section>';
  }
  return h;
}

// ---------- Insights: where the money is going and where to cut back ----------
// Compares this bill month with the person's usual (average of up to 3 earlier months), scaled to how far
// into the month we are, so a half-finished month is compared with half a usual month.
function viewInsights(ym) {
  var now = ymOf(new Date());
  if (ym > now) return '';
  var cur = expenses(scope(inMonth(ym))), spent = sum(cur);
  // A bill month spans from the earliest card cycle start (e.g. 23 Oct) to the end of the calendar month.
  var p = ym.split('-'), start = new Date(+p[0], +p[1] - 1, 1), end = new Date(+p[0], +p[1], 0);
  myCards().forEach(function (c) { if (stmtDay(c)) { var st = statement(c, ym); if (st.start < start) start = st.start; if (st.end > end) end = st.end; } });
  var span = Math.round((end - start) / 864e5) + 1, t0 = today0();
  var isCur = ym === now, f = isCur ? Math.min(Math.max((Math.round((t0 - start) / 864e5) + 1) / span, 0), 1) : 1;
  var dim = span, day = Math.round((t0 - start) / 864e5) + 1;
  var prev = [1, 2, 3].map(function (i) { return expenses(scope(inMonth(ymAdd(ym, -i)))); }).filter(function (l) { return l.length; });
  var last = sum(expenses(scope(inMonth(ymAdd(ym, -1)))));
  var R = function (v) { return inr.format(v); }, r100 = function (v) { return Math.round(v / 100) * 100; };
  var out = [];

  // 1. Pace for the month. One-off and monthly bills (rent, EMI, a big purchase) are counted once, not scaled up.
  if (isCur && f >= 0.15 && f < 0.97 && last > 0 && spent > 0) {
    var once = sum(cur.filter(function (t) { return FIXED_CATS.indexOf(t.category) >= 0 || +t.amount >= last * 0.2; }));
    var proj = once + (spent - once) / f, d = proj - last, left = Math.max(dim - day, 1);
    if (Math.abs(d) >= Math.max(500, last * 0.05)) {
      if (d > 0) out.push({ tone: 'bad', i: '📈', t: 'At this pace you\'ll spend about <b>' + R(r100(proj)) + '</b> this month, <b>' + R(r100(d)) + ' more</b> than last month.',
        tip: last > spent ? 'Keep it under ' + R(Math.floor((last - spent) / left)) + ' a day for the rest of the month to match last month.' : 'You have already passed last month\'s total of ' + R(last) + '.' });
      else out.push({ tone: 'good', i: '👍', t: 'On track for about <b>' + R(r100(proj)) + '</b>, <b>' + R(r100(-d)) + ' less</b> than last month.' });
    }
  }

  // 2 & 4. Categories above / below the usual
  if (prev.length) {
    var byCat = function (list) { var m = {}; list.forEach(function (t) { var c = t.category || 'Other'; m[c] = (m[c] || 0) + (+t.amount || 0); }); return m; };
    var now_ = byCat(cur), avg = {};
    prev.forEach(function (l) { var m = byCat(l); Object.keys(m).forEach(function (k) { avg[k] = (avg[k] || 0) + m[k] / prev.length; }); });
    var rows = Object.keys(Object.assign({}, now_, avg)).map(function (k) {
      var base = (avg[k] || 0) * (FIXED_CATS.indexOf(k) >= 0 ? 1 : f), v = now_[k] || 0;   // monthly bills aren't spread over the month
      return { k: k, v: v, base: base, d: v - base };
    });
    var up = rows.filter(function (x) { return x.d >= Math.max(500, x.base * 0.25); }).sort(function (a, b) { return b.d - a.d; })[0];
    if (up) {
      var top = topNotes(cur.filter(function (t) { return (t.category || 'Other') === up.k; }))[0];
      out.push({ tone: 'bad', i: catIcon(up.k), t: '<b>' + esc(up.k) + '</b> is <b>' + R(r100(up.d) || up.d) + ' above</b> your usual' + (isCur ? ' for this point in the month' : '') +
        (up.base >= 100 ? ' (+' + Math.round(up.d / up.base * 100) + '%)' : '') + '.', tip: top ? 'Most of it: ' + esc(top.name) + ' ' + R(top.v) + (top.n > 1 ? ' (' + top.n + ' times)' : '') + '.' : '' });
    }
    var down = (isCur && f < 0.5) ? null : rows.filter(function (x) { return x.base >= 500 && -x.d >= Math.max(500, x.base * 0.25) && !(isCur && FIXED_CATS.indexOf(x.k) >= 0); }).sort(function (a, b) { return a.d - b.d; })[0];
    if (down) out.push({ tone: 'good', i: catIcon(down.k), t: '<b>' + esc(down.k) + '</b> is <b>' + R(r100(-down.d) || -down.d) + ' below</b> your usual. Nice.' });
  }

  // 3. Small spends that keep repeating
  var rep_ = topNotes(cur).filter(function (x) { return x.n >= 3; })[0];
  if (rep_) out.splice(Math.min(out.length, 2), 0, { tone: 'warn', i: '🔁', t: '<b>' + esc(rep_.name) + '</b>: ' + rep_.n + ' times, <b>' + R(rep_.v) + '</b>' + (isCur ? ' so far' : '') + '.',
    tip: isCur && f < 0.9 ? 'Halving it would have saved ' + R(Math.round(rep_.v / 2)) + ' already this month.' : 'Halving it saves about ' + R(Math.round(rep_.v / 2)) + ' a month.' });

  // 5. Biggest single spend
  if (out.length < 4 && cur.length) {
    var big = cur.slice().sort(function (a, b) { return b.amount - a.amount; })[0], bd = parseLocal(big.date);
    out.push({ tone: '', i: catIcon(big.category), t: 'Biggest spend: <b>' + esc(big.note || big.category) + '</b> ' + R(+big.amount) + ' on ' + dayLabel(bd) +
      (spent ? ' (' + Math.round(big.amount / spent * 100) + '% of the month)' : '') + '.' });
  }
  if (!out.length) return '';
  return '<section class="card"><div class="row"><h2>Insights</h2>' + (prev.length ? '' : '<span class="small muted">Gets smarter after a month</span>') + '</div>' +
    out.slice(0, 4).map(function (x) {
      return '<div class="ins ' + x.tone + '"><span class="i" aria-hidden="true">' + x.i + '</span><p>' + x.t + (x.tip ? '<span class="tip">' + x.tip + '</span>' : '') + '</p></div>';
    }).join('') + '</section>';
}
// Group entries by note (shop, app, person): [{name, n, v}] biggest first.
function topNotes(list) {
  var m = {};
  list.forEach(function (t) {
    var k = String(t.note || '').trim(); if (!k) return;
    var e = m[k.toLowerCase()] || (m[k.toLowerCase()] = { name: k, n: 0, v: 0 });
    e.n++; e.v += +t.amount || 0;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.v - a.v; });
}

// Small progress ring for a card's limit used (fraction 0..1+).
function ring(f) {
  var r = 19, c = 2 * Math.PI * r, used = Math.min(Math.max(f, 0), 1);
  return '<svg class="ring" viewBox="0 0 46 46" aria-label="' + Math.round(f * 100) + '% of limit used"><circle cx="23" cy="23" r="' + r + '" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/>' +
    '<circle cx="23" cy="23" r="' + r + '" fill="none" stroke="' + (f >= 0.9 ? '#ffb4ab' : '#fff') + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (c * used).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 23 23)"/>' +
    '<text x="23" y="27" text-anchor="middle">' + Math.round(f * 100) + '%</text></svg>';
}

function meter(v, max) {
  var f = max ? v / max : 0;
  return '<div class="meter' + (f >= 1 ? ' bad' : f >= 0.8 ? ' warn' : '') + '"><i style="width:' + Math.min(f * 100, 100).toFixed(1) + '%"></i></div>';
}

function viewHistory() {
  if (!myCards().length) return viewHome();

  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var h = sampleBanner() + whoBar() + '<section class="card"><div class="two"><input class="in" id="q" type="search" placeholder="Search note, amount…" value="' + esc(ui.q) + '">' +

    '<div class="row small muted"><span>' + list.length + ' entries in ' + esc(ymLabel(ui.ym)) + ' bills</span><b>' + inr.format(sum(expenses(list))) + ' spent</b></div>';

      '<div><div class="t1">' + esc(t.note || (isExp ? t.category : t.kind)) + '</div><div class="t2">' + esc((shared() && whoOf(t) ? personName(whoOf(t)) + ' · ' : '') + (c ? c.name : 'Unknown card') + ' · ' + (isExp ? t.category : t.kind) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes())) + '</div></div>' +
      '<div class="amt' + (isExp ? '' : ' other') + '">' + (t.kind === 'Received' ? '+' : '') + inr.format(+t.amount) + '</div></button>';

function viewBills() {
  var cc = myCards().filter(function (c) { return stmtDay(c); });
  if (!cc.length) return '<section class="card empty"><p class="muted">Add a credit card with its statement day in Settings to see bills here.</p><button type="button" class="btn" data-act="new-card">Add a credit card</button></section>';
  var t0 = today0(), h = sampleBanner();
  cc.forEach(function (c) {
    var dates = S.tx.filter(function (t) { return t.card === c.id; }).map(function (t) { return billMonth(t); });
    var open = billMonthFor(c, new Date());
    var first = dates.length ? dates.reduce(function (a, b) { return a < b ? a : b; }) : open;
    h += '<section class="card"><div class="cc-head"><span class="swatch" style="background:' + c.color + '"></span><span class="cc-name">' + esc(c.name) + '</span><span class="small muted">' + (shared() && !personal() && c.owner ? esc(c.owner === 'family' ? 'Joint' : personName(c.owner)) + ' · ' : '') + 'Statement on ' + ordinal(c.stmtDay) + '</span></div>';
    for (var m = open; m >= first; m = ymAdd(m, -1)) {
      var st = statement(c, m), amt = chargedOn(c.id, m), key = c.id + '|' + m, paid = !!S.paid[key], isOpen = st.date > t0;
      var dueSoon = !paid && !isOpen && st.due && (st.due - t0) / 864e5 <= 3;
      h += '<div class="stmt"><div><b>' + esc(ymLabel(m)) + '</b> <span class="small muted">' + dayLabel(st.start) + ' – ' + dayLabel(st.end) + '</span>' +
        '<div class="small ' + (dueSoon ? 'up' : 'muted') + '">' + (isOpen ? 'Open cycle · statement ' + dayLabel(st.date) : st.due ? 'Due ' + dayLabel(st.due) + (dueSoon ? (st.due < t0 ? ' · overdue' : ' · due soon') : '') : 'Set the payment due day on the card (Settings) to see the due date') + '</div></div>' +
        '<div style="display:grid;gap:6px;justify-items:end"><b>' + inr.format(amt) + '</b>' +
        (isOpen ? '<span class="pill">Open</span>' : '<button type="button" class="toggle" data-paid="' + key + '" aria-pressed="' + paid + '">' + (paid ? 'Paid' : 'Mark paid') + '</button>') + '</div></div>';
    }
    h += '</section>';
  });
  return h;
}
function ordinal(n) { n = +n; var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

    CATS.map(function (c, i) { return '<label for="b' + i + '" style="display:flex;gap:8px;align-items:center"><span aria-hidden="true">' + CAT_ICONS[i] + '</span>' + esc(c) + '</label>' +

  if (!syncOn()) {

      (S.sync.sheetUrl ? '<a class="btn ghost" style="text-align:center;text-decoration:none" href="' + esc(S.sync.sheetUrl) + '" target="_blank" rel="noopener">Open sheet</a>' : '') + '</div>' +
      '<button type="button" class="btn ghost block" data-act="pull">Reload from Google Sheet</button>' +
      '<button type="button" class="linkish" style="justify-self:start" data-act="disconnect">Disconnect</button></section>';
  }

  h += '<section class="card"><h2>This phone</h2>' +
    '<button type="button" class="btn danger block" data-act="reset">Delete all data on this phone</button></section>' +
    '<p class="small muted" style="text-align:center;margin:4px 0">Selavu · works offline · ' + myTx().length + ' entries · ' + myCards().length + ' cards' +
      (personal() && S.tx.length > myTx().length ? ' on this phone · ' + S.tx.length + ' in the household sheet' : '') + '</p>';
  return h;

// ---------- Events ----------
function bindView(v) {
  $$('[data-act]', v).forEach(function (b) { b.addEventListener('click', function () { actions[b.dataset.act](); }); });
  $$('[data-edit]', v).forEach(function (b) { b.addEventListener('click', function () { openExpense(S.tx.filter(function (t) { return t.id === b.dataset.edit; })[0]); }); });
  $$('[data-card]', v).forEach(function (b) { b.addEventListener('click', function () { openCard(cardById(b.dataset.card)); }); });
  $$('[data-person]', v).forEach(function (b) { b.addEventListener('click', function () { openPerson(personById(b.dataset.person)); }); });
  $$('[data-who]', v).forEach(function (b) { b.addEventListener('click', function () { ui.who = b.dataset.who; render(); }); });
  $$('[data-cardhist]', v).forEach(function (b) { b.addEventListener('click', function () { ui.cardFilter = b.dataset.cardhist; ui.tab = 'history'; render(); window.scrollTo(0, 0); }); });
  $$('[data-count]', v).forEach(countUp);
  $$('[data-paid]', v).forEach(function (b) { b.addEventListener('click', function () {
    var k = b.dataset.paid; if (S.paid[k]) delete S.paid[k]; else S.paid[k] = toLocal(new Date()); queue('paid', k); save(); render(); }); });
  $$('[data-budget]', v).forEach(function (i) { i.addEventListener('change', function () {
    var n = Math.round(+String(i.value).replace(/[^\d.]/g, '')); if (n > 0) S.budgets[i.dataset.budget] = n; else delete S.budgets[i.dataset.budget]; i.value = S.budgets[i.dataset.budget] || ''; queue('budget', i.dataset.budget); save(); toast('Budget saved'); }); });
  var q = $('#q', v); if (q) q.addEventListener('input', function () { ui.q = q.value; var pos = q.selectionStart; render(); var n = $('#q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} });
  var cf = $('#cardFilter', v); if (cf) cf.addEventListener('change', function () { ui.cardFilter = cf.value; render(); });
}

// The big total counts up when it changes (not on every redraw).
var shownTotal = {};
function countUp(el) {
  var to = +el.dataset.count, key = ui.ym + '|' + ui.who, from = shownTotal[key];
  shownTotal[key] = to;
  if (from === to || !window.requestAnimationFrame || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  from = from || 0;
  var t0 = null, dur = 600;
  var step = function (ts) {
    if (!el.isConnected) return;
    t0 = t0 || ts;
    var k = Math.min((ts - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = inr.format(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

$$('nav.tabs [data-tab]').forEach(function (b) { b.addEventListener('click', function () { ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }); });
$('#addBtn').addEventListener('click', function () { openExpense(); });
$('#prevM').addEventListener('click', function () { ui.ym = ymAdd(ui.ym, -1); render(); });
$('#nextM').addEventListener('click', function () { ui.ym = ymAdd(ui.ym, 1); render(); });

// ---------- Sheets (forms) ----------
function openSheet(html, mount) {
  var root = $('#sheetRoot');
  root.innerHTML = '<div class="sheet-back"><div class="sheet gutter" role="dialog" aria-modal="true"><div class="grab"></div>' + html + '</div></div>';
  var back = $('.sheet-back', root);
  back.addEventListener('click', function (e) { if (e.target === back) closeSheet(); });
  document.addEventListener('keydown', escClose);
  mount($('.sheet', root));
  fitSheet();
}
// Keep forms above the on-screen keyboard (iPhone and Android shrink only the visual viewport).
function fitSheet() {
  var back = $('.sheet-back'), vv = window.visualViewport;
  if (!back || !vv) return;
  back.style.top = vv.offsetTop + 'px';
  back.style.height = vv.height + 'px';
  back.style.bottom = 'auto';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }
// A focused field inside a form scrolls into view above the keyboard.
document.addEventListener('focusin', function (e) {
  if (e.target.closest && e.target.closest('.sheet')) setTimeout(function () { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) {} }, 300);
});
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); if (staleView) { staleView = false; render(); } }

// Entries this phone logs often (same note, card, kind and category), newest amount first.
function quickPicks() {
  var since = toLocal(addDays(today0(), -120)), m = {};
  S.tx.forEach(function (t) {
    if (t.date < since || !cardById(t.card)) return;
    if (shared() && t.by && t.by !== S.me) return;
    var key = [t.kind, t.category, String(t.note || '').trim().toLowerCase(), t.card].join('|');
    var e = m[key] || (m[key] = { n: 0, last: null });
    e.n++; if (!e.last || t.date > e.last.date) e.last = t;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).filter(function (e) { return e.n >= 2; })
    .sort(function (a, b) { return b.n - a.n || (a.last.date < b.last.date ? 1 : -1); }).slice(0, 6).map(function (e) { return e.last; });
}

var CAL_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;flex:none;color:var(--muted)"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
// Month-style grid of day numbers (1..max) for picking "day of month".
function dayGrid(id, max) {
  var h = '<div class="daygrid" id="' + id + '" hidden role="group" aria-label="Day of month">';
  for (var d = 1; d <= max; d++) h += '<button type="button" data-d="' + d + '" aria-pressed="false">' + d + '</button>';
  return h + (max === 28 ? '<p class="hint" style="grid-column:1/-1;margin:2px 0 0">Banks set statement days between 1 and 28.</p>' : '') + '</div>';
}

function guessCategory(text) {
  var m = MAP[String(text || '').trim().toLowerCase()];
  return m && m[0] === 'Expense' ? m[1] : '';
}

function openCard(c) {
